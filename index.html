  <style>
    #map { height: 380px; width: 100%; z-index: 10; }
    @media (min-width: 768px) {
      #map { height: 100%; min-height: 550px; }
    }
    
    /* Custom Map Markers */
    .custom-div-icon {
      background: #4f46e5;
      color: white;
      border-radius: 50%;
      text-align: center;
      font-weight: bold;
      font-size: 12px;
      line-height: 26px;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s ease;
    }
    .custom-div-icon:hover {
      transform: scale(1.15);
    }
    .custom-div-icon.completed { 
      background: #22c55e; 
    }

    /* WC Marker */
    .wc-icon {
      background: #0284c7;
      color: white;
      border-radius: 8px;
      text-align: center;
      font-size: 12px;
      line-height: 22px;
      border: 2px solid white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
    }

    /* User GPS Pulsing Dot */
    .user-location-marker {
      background: #2563eb;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 0 8px rgba(37, 99, 235, 0.3);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0px rgba(37, 99, 235, 0.5); }
      70% { box-shadow: 0 0 0 12px rgba(37, 99, 235, 0); }
      100% { box-shadow: 0 0 0 0px rgba(37, 99, 235, 0); }
    }
  </style>

          longDesc: "Conta com lago para pedalinhos, palmeiras e a imponente fonte 'Cascada Monumental', que teve participação do jovem Gaudí."
        },
        de: {
          name: "Parc de la Ciutadella",
          shortDesc: "Grüne Oase im Stadtzentrum.",
          longDesc: "Mit Ruderboot-Teich, Palmen und dem imposanten Barockbrunnen 'Cascada Monumental', an dem der junge Gaudí mitwirkte."
        }
      },
      {
        id: 24,
        coords: [41.3911, 2.1806],
        wiki: "https://pt.wikipedia.org/wiki/Arco_do_Triunfo_(Barcelona)",
        pt: {
          name: "Arc de Triomf",
          shortDesc: "Arco do triunfo em tijolos vermelhos.",
          longDesc: "Construído como portão de entrada principal para a Exposição Universal de 1888."
        },
        de: {
          name: "Arc de Triomf",
          shortDesc: "Triumphbogen aus roten Backsteinen.",
          longDesc: "Erbaut als imposable Haupteingangstor zur Weltausstellung von 1888 im Mudejar-Stil."
        }
      },
      {
        id: 25,
        coords: [41.4005, 2.1798],
        wiki: "",
        pt: {
          name: "La Monumental",
          shortDesc: "Antiga arena de touros.",
          longDesc: "Construída em estilo neo-mourisco. Hoje é utilizada para eventos culturais e concertos musicais."
        },
        de: {
          name: "La Monumental",
          shortDesc: "Historische Stierkampfarena.",
          longDesc: "Erbaut im Neomudéjar-Stil. Heute geschützte Event-Location für Konzerte und Märkte."
        }
      },
      {
        id: 26,
        coords: [41.4036, 2.1744],
        wiki: "https://pt.wikipedia.org/wiki/Templo_Expiat%C3%B3rio_da_Sagrada_Fam%C3%ADlia",
        pt: {
          name: "Sagrada Família",
          shortDesc: "O grande encerramento do roteiro.",
          longDesc: "A grande obra da vida de Gaudí e o símbolo máximo de Barcelona. Combina formas da natureza com arquitetura monumental."
        },
        de: {
          name: "Sagrada Família",
          shortDesc: "Das krönende Highlight der Tour.",
          longDesc: "Gaudís unvollendetes Meisterwerk und Wahrzeichen Barcelonas. Verbindet gotische Kathedralbaukunst mit organischen Formen der Natur."
        }
      }
    ];

    // Public Toilets Data
    const publicToilets = [
      { name: "WC Metrô Diagonal", coords: [41.3966, 2.1585] },
      { name: "WC El Nacional / Passeig de Gràcia", coords: [41.3901, 2.1680] },
      { name: "WC Público Plaça Catalunya", coords: [41.3868, 2.1702] },
      { name: "WC Mercat de la Boqueria", coords: [41.3815, 2.1712] },
      { name: "WC Maremagnum / Porto", coords: [41.3761, 2.1808] },
      { name: "WC Praia da Barceloneta", coords: [41.3762, 2.1915] },
      { name: "WC Parc de la Ciutadella", coords: [41.3875, 2.1865] },
      { name: "WC Sagrada Família (Praça)", coords: [41.4032, 2.1740] }
    ];

    // App State Variables
    let currentLang = localStorage.getItem('bcn_tour_lang') || 'pt';
    let completedStops = JSON.parse(localStorage.getItem('bcn_tour_completed') || '[]');
    let showWC = true;
    let userMarker = null;
    let watchId = null;

    const map = L.map('map').setView([41.385, 2.175], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const latLngs = stops.map(s => s.coords);
    L.polyline(latLngs, { color: '#4f46e5', weight: 4, opacity: 0.7, dashArray: '6, 8' }).addTo(map);

    const stopMarkers = {};
    const wcMarkersGroup = L.layerGroup().addTo(map);

    function updateUI() {
      const txt = uiTranslations[currentLang];

      // Update Titles & Buttons
      document.getElementById('app-title').innerText = txt.appTitle;
      document.getElementById('app-subtitle').innerText = txt.appSubtitle;
      document.getElementById('label-wc').innerText = showWC ? txt.wcShow : txt.wcHide;
      
      if (!watchId) {
        document.getElementById('label-gps').innerText = txt.gpsLabel;
      }

      // Language Buttons Style
      const ptBtn = document.getElementById('lang-pt-btn');
      const deBtn = document.getElementById('lang-de-btn');

      if (currentLang === 'pt') {
        ptBtn.className = "flex items-center gap-1.5 px-2.5 py-1 rounded text-xs font-medium transition-all bg-white text-indigo-900 shadow-sm font-bold";
        deBtn.className = "flex items-center gap-1.5 px-2.5 py-1 rounded text-xs font-medium transition-all text-indigo-200 hover:text-white";
      } else {
        deBtn.className = "flex items-center gap-1.5 px-2.5 py-1 rounded text-xs font-medium transition-all bg-white text-indigo-900 shadow-sm font-bold";
        ptBtn.className = "flex items-center gap-1.5 px-2.5 py-1 rounded text-xs font-medium transition-all text-indigo-200 hover:text-white";
      }

      // Update Progress
      document.getElementById('progress-text').innerText = `${completedStops.length} / ${stops.length} ${txt.visitedLabel}`;

      // Render Cards & Markers
      renderStops();
      renderToilets();
    }

    function setLanguage(lang) {
      if (currentLang !== lang) {
        currentLang = lang;
        localStorage.setItem('bcn_tour_lang', lang);
        
        // Stop active audio when switching language
        if ('speechSynthesis' in window && window.speechSynthesis.speaking) {
          window.speechSynthesis.cancel();
        }

        updateUI();
      }
    }

    function renderToilets() {
      wcMarkersGroup.clearLayers();
      const txt = uiTranslations[currentLang];

      if (showWC) {
        publicToilets.forEach(wc => {
          const wcIcon = L.divIcon({
            className: 'wc-icon',
            html: '🚻',
            iconSize: [24, 24],
            iconAnchor: [12, 12]
          });
          L.marker(wc.coords, { icon: wcIcon })
            .bindPopup(`<b>${txt.wcPopupTitle}</b><br>${wc.name}`)
            .addTo(wcMarkersGroup);
        });
      }
    }

    function renderStops() {
      const container = document.getElementById('stops-container');
      container.innerHTML = '';
      const txt = uiTranslations[currentLang];

      stops.forEach((stop) => {
        const isCompleted = completedStops.includes(stop.id);
        const data = stop[currentLang];

        // Update or create map marker
        if (!stopMarkers[stop.id]) {
          const customIcon = L.divIcon({
            className: `custom-div-icon ${isCompleted ? 'completed' : ''}`,
            html: `${stop.id}`,
            iconSize: [26, 26],
            iconAnchor: [13, 13]
          });

          const marker = L.marker(stop.coords, { icon: customIcon }).addTo(map);
          stopMarkers[stop.id] = marker;
        } else {
          // Refresh marker icon state
          const customIcon = L.divIcon({
            className: `custom-div-icon ${isCompleted ? 'completed' : ''}`,
            html: `${stop.id}`,
            iconSize: [26, 26],
            iconAnchor: [13, 13]
          });
          stopMarkers[stop.id].setIcon(customIcon);
        }

        // Refresh Popup content
        stopMarkers[stop.id].bindPopup(`<b>${stop.id}. ${data.name}</b><br>${data.shortDesc}`);

        // Create Card HTML
        const card = document.createElement('div');
        card.className = `p-4 bg-white rounded-xl shadow-sm border ${isCompleted ? 'border-green-200 bg-green-50/30' : 'border-slate-200'} transition-all hover:shadow-md`;

        const escapedSpeechText = `${data.name}. ${data.longDesc}`.replace(/'/g, "\\'").replace(/"/g, '&quot;');

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2 cursor-pointer" onclick="focusStop(${stop.id})">
            <div class="flex items-start gap-3">
              <button onclick="event.stopPropagation(); toggleStop(${stop.id})" class="mt-0.5 w-6 h-6 rounded-full border flex items-center justify-center font-bold text-xs shrink-0 ${isCompleted ? 'bg-green-500 text-white border-green-500' : 'border-slate-300 text-slate-500 hover:border-indigo-500'}" title="Marcar como visitado">
                ${isCompleted ? '✓' : stop.id}
              </button>
              <div>
                <h3 class="font-bold text-sm ${isCompleted ? 'line-through text-slate-400' : 'text-slate-800'}">${data.name}</h3>
                <p class="text-xs text-slate-500 mt-0.5">${data.shortDesc}</p>
              </div>
            </div>
            <button onclick="event.stopPropagation(); toggleSpeech('${escapedSpeechText}')" class="p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg shrink-0 transition" title="${txt.audioTooltip}">
              <i data-lucide="volume-2" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="mt-3 pt-3 border-t border-slate-100 text-xs text-slate-600 space-y-2">
            <p class="leading-relaxed">${data.longDesc}</p>
            
            ${data.gastro ? `
              <div class="p-2.5 bg-amber-50 border border-amber-200 rounded-lg text-amber-900 font-medium flex items-start gap-1.5">
                <span class="shrink-0">💡</span>
                <div>${data.gastro}</div>
              </div>
            ` : ''}

            ${stop.wiki ? `
              <a href="${stop.wiki}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-indigo-600 hover:underline font-semibold pt-1">
                ${txt.readMoreWiki} <i data-lucide="external-link" class="w-3 h-3"></i>
              </a>
            ` : ''}
          </div>
        `;

        container.appendChild(card);
      });

      lucide.createIcons();
    }

    window.focusStop = function(id) {
      const stop = stops.find(s => s.id === id);
      if (stop) {
        map.setView(stop.coords, 16);
        stopMarkers[id].openPopup();
      }
    };

    window.toggleStop = function(id) {
      if (completedStops.includes(id)) {
        completedStops = completedStops.filter(i => i !== id);
      } else {
        completedStops.push(id);
      }
      localStorage.setItem('bcn_tour_completed', JSON.stringify(completedStops));
      updateUI();
    };

    window.toggleWC = function() {
      showWC = !showWC;
      renderToilets();
      const txt = uiTranslations[currentLang];
      const btn = document.getElementById('wc-toggle');
      document.getElementById('label-wc').innerText = showWC ? txt.wcShow : txt.wcHide;

      btn.className = showWC 
        ? "px-3 py-2 bg-sky-50 text-sky-700 border border-sky-200 rounded-lg font-semibold flex items-center gap-2 transition active:scale-95"
        : "px-3 py-2 bg-slate-100 text-slate-400 border border-slate-200 rounded-lg font-semibold flex items-center gap-2 transition opacity-60 active:scale-95";
    };

    // Text-to-Speech Audio Engine
    window.toggleSpeech = function(text) {
      if ('speechSynthesis' in window) {
        if (window.speechSynthesis.speaking) {
          window.speechSynthesis.cancel();
          return;
        }
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = currentLang === 'pt' ? 'pt-BR' : 'de-DE';
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      } else {
        alert(uiTranslations[currentLang].ttsUnsupported);
      }
    };

    // Live GPS Location Tracking
    window.toggleGPS = function() {
      const btn = document.getElementById('gps-btn');
      const label = document.getElementById('label-gps');
      const txt = uiTranslations[currentLang];

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        if (userMarker) map.removeLayer(userMarker);
        userMarker = null;

        btn.classList.remove('bg-indigo-600', 'text-white');
        btn.classList.add('bg-slate-100');
        label.innerText = txt.gpsLabel;
        return;
      }

      if ('geolocation' in navigator) {
        btn.classList.add('bg-indigo-600', 'text-white');
        btn.classList.remove('bg-slate-100');
        label.innerText = txt.gpsSearching;

        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const userCoords = [pos.coords.latitude, pos.coords.longitude];
            
            if (!userMarker) {
              const userIcon = L.divIcon({
                className: 'user-location-marker',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
              });
              userMarker = L.marker(userCoords, { icon: userIcon })
                .addTo(map)
                .bindPopup(`<b>${txt.userLocation}</b>`);
              
              map.setView(userCoords, 16);
            } else {
              userMarker.setLatLng(userCoords);
            }
            label.innerText = txt.gpsActive;
          },
          (err) => {
            alert(txt.gpsError);
            toggleGPS();
          },
          { enableHighAccuracy: true }
        );
      } else {
        alert(txt.noGps);
      }
    };

    // Initialize Viewport and App Render
    map.fitBounds(L.latLngBounds(latLngs), { padding: [25, 25] });
    updateUI();
  </script>
</body>
</html>
