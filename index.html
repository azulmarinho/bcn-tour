<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcelona Walking Tour & Audioguide</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    #map { height: 380px; width: 100%; z-index: 10; }
    @media (min-width: 768px) {
      #map { height: 100%; min-height: 550px; }
    }

    /* Custom Map Markers */
    .custom-div-icon {
      background: #4f46e5;
      color: white;
      border-radius: 50%;
      text-align: center;
      font-weight: bold;
      font-size: 12px;
      line-height: 26px;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s ease;
    }
    .custom-div-icon:hover { transform: scale(1.15); }
    .custom-div-icon.completed { background: #22c55e; }
    /* Stops with extra highlights get a small amber ring */
    .custom-div-icon.has-details { box-shadow: 0 0 0 3px #fbbf24, 0 2px 6px rgba(0,0,0,0.3); }

    /* WC Marker */
    .wc-icon {
      background: #0284c7;
      color: white;
      border-radius: 8px;
      text-align: center;
      font-size: 12px;
      line-height: 22px;
      border: 2px solid white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
    }

    /* User GPS Pulsing Dot */
    .user-location-marker {
      background: #2563eb;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 0 8px rgba(37, 99, 235, 0.3);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0px rgba(37, 99, 235, 0.5); }
      70% { box-shadow: 0 0 0 12px rgba(37, 99, 235, 0); }
      100% { box-shadow: 0 0 0 0px rgba(37, 99, 235, 0); }
    }

    /* Details panel open/close */
    .details-panel { display: none; }
    .details-panel.open { display: block; }
    .chevron { transition: transform 0.2s ease; }
    .open-btn .chevron { transform: rotate(180deg); }

    /* Highlight image: placeholder colour while loading */
    .hl-img-wrap { background: #e2e8f0; }
    .hl-img-wrap img { transition: transform 0.3s ease; }
    .hl-img-wrap:hover img { transform: scale(1.03); }

    /* Card selected on the map: short amber glow */
    @keyframes cardFlash {
      0%   { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
      15%  { box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.9); }
      100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }
    .card-flash { animation: cardFlash 2s ease-out; }

    /* Lightbox */
    #lightbox { display: none; }
    #lightbox.open { display: flex; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
    button:focus-visible, a:focus-visible { outline: 2px solid #f59e0b; outline-offset: 2px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen font-sans">

        <div class="flex items-center bg-indigo-800 p-1 rounded-lg border border-indigo-500/50">

          </button>
          <button id="lang-de-btn" onclick="setLanguage('de')" class="flex items-center gap-1.5 px-2.5 py-1 rounded text-xs font-medium transition-all text-indigo-200 hover:text-white" title="Deutsch">
            <span class="text-sm">🇩🇪</span> <span class="hidden sm:inline font-bold">DE</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div id="toolbar" class="bg-white border-b border-slate-200 p-3 sticky top-[60px] z-40 shadow-sm">
    <div class="max-w-5xl mx-auto flex flex-wrap gap-2 justify-between items-center text-xs">
      <button id="gps-btn" onclick="toggleGPS()" class="px-3 py-2 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 border border-slate-300 rounded-lg font-semibold flex items-center gap-2 transition active:scale-95">
        <i data-lucide="navigation" class="w-4 h-4"></i> <span id="label-gps">Localização GPS</span>
      </button>

      <div class="flex items-center gap-2">
        <button id="wc-toggle" onclick="toggleWC()" class="px-3 py-2 bg-sky-50 text-sky-700 border border-sky-200 rounded-lg font-semibold flex items-center gap-2 transition active:scale-95">
          <i data-lucide="bath" class="w-4 h-4"></i> <span id="label-wc">🚻 Ocultar Banheiros</span>
        </button>
      </div>
    </div>
  </div>

  <main class="flex-1 max-w-5xl w-full mx-auto p-4 flex flex-col md:flex-row gap-4">
    <!-- Left Column: Map -->
    <div class="w-full md:w-1/2 flex flex-col gap-4">
      <div id="map-card" class="bg-white rounded-xl shadow-md overflow-hidden border border-slate-200 sticky top-[130px]">
        <div id="map"></div>
        <div class="p-3 bg-slate-100 border-t border-slate-200 text-xs text-slate-600 flex justify-between items-center font-medium">
          <span class="flex items-center gap-1"><i data-lucide="footprints" class="w-4 h-4 text-indigo-500"></i> ~12-14 km</span>
          <span class="flex items-center gap-1"><i data-lucide="clock" class="w-4 h-4 text-indigo-500"></i> ~7-9 h</span>
        </div>
      </div>
    </div>

    <!-- Right Column: Interactive List -->
    <div class="w-full md:w-1/2 flex flex-col gap-3" id="stops-container"></div>
  </main>

  <!-- Lightbox for highlight photos -->
  <div id="lightbox" class="fixed inset-0 z-[2000] bg-slate-950/95 text-white flex-col" role="dialog" aria-modal="true" aria-labelledby="lb-title">
    <div class="flex items-center justify-between p-3 text-sm">
      <span id="lb-counter" class="text-slate-300 font-medium"></span>
      <button id="lb-close" onclick="closeLightbox()" class="p-2 rounded-lg hover:bg-white/10" aria-label="Fechar">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
    </div>
    <div class="relative flex-1 min-h-0 flex items-center justify-center px-2" id="lb-stage">
      <button id="lb-prev" onclick="stepLightbox(-1)" class="absolute left-2 z-10 p-2 rounded-full bg-black/40 hover:bg-black/60" aria-label="Anterior">
        <i data-lucide="chevron-left" class="w-7 h-7"></i>
      </button>
      <img id="lb-img" src="" alt="" class="max-h-full max-w-full object-contain rounded" />
      <button id="lb-next" onclick="stepLightbox(1)" class="absolute right-2 z-10 p-2 rounded-full bg-black/40 hover:bg-black/60" aria-label="Próximo">
        <i data-lucide="chevron-right" class="w-7 h-7"></i>
      </button>
    </div>
    <div class="p-4 max-w-2xl w-full mx-auto">
      <h2 id="lb-title" class="font-bold text-base"></h2>
      <p id="lb-text" class="text-sm text-slate-300 mt-1 leading-relaxed max-h-32 overflow-y-auto"></p>
      <p id="lb-credit" class="text-[11px] text-slate-400 mt-2"></p>
    </div>
  </div>

    // ---------- Storage (wrapped so the page still works if storage is blocked) ----------
    function loadStored(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v === null ? fallback : JSON.parse(v);
      } catch (e) { return fallback; }
    }
    function saveStored(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }

    // ---------- App state ----------
    let currentLang = loadStored('bcn_tour_lang_v2', 'pt');
    // v2: a new stop 3 (Passeig de Gràcia) was inserted, so old ids >= 3 move up by one
    let completedStops = loadStored('bcn_tour_completed_v2', null);
    if (completedStops === null) {
      completedStops = loadStored('bcn_tour_completed', []).map(id => id >= 3 ? id + 1 : id);
      saveStored('bcn_tour_completed_v2', completedStops);
    }
    let showWC = true;
    let userMarker = null;
    let watchId = null;
    const openDetails = new Set();     // stop ids with expanded details
    let lightboxState = null;           // { stopId, index }

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const latLngs = stops.map(s => s.coords);
    L.polyline(latLngs, { color: '#4f46e5', weight: 4, opacity: 0.7, dashArray: '6, 8' }).addTo(map);

    const stopMarkers = {};
    const wcMarkersGroup = L.layerGroup().addTo(map);

    // ---------- Helpers ----------
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function creditHtml(h, txt) {
      if (!h.img) return '';
      const who = h.author ? escapeHtml(h.author) : 'Wikimedia Commons';
      const lic = h.license ? ` (${escapeHtml(h.license)})` : '';
      return `${txt.photo}: ${who}${lic} – <a href="${commonsPage(h.img)}" target="_blank" rel="noopener noreferrer" class="underline hover:text-indigo-600">${txt.source}</a>`;
    }

    function getStop(id) { return stops.find(s => s.id === id); }

    // ---------- Render ----------
    function updateUI() {
      const txt = uiTranslations[currentLang];
      document.documentElement.lang = currentLang === 'pt' ? 'pt-BR' : 'de';

      document.getElementById('app-title').innerText = txt.appTitle;
      document.getElementById('app-subtitle').innerText = txt.appSubtitle;
      document.getElementById('label-wc').innerText = showWC ? txt.wcHide : txt.wcShow;

      if (watchId === null) {
        document.getElementById('label-gps').innerText = txt.gpsLabel;
      }

      const ptBtn = document.getElementById('lang-pt-btn');
      const deBtn = document.getElementById('lang-de-btn');
      const activeCls = "flex items-center gap-1.5 px-2.5 py-1 rounded text-xs font-medium transition-all bg-white text-indigo-900 shadow-sm font-bold";
      const idleCls = "flex items-center gap-1.5 px-2.5 py-1 rounded text-xs font-medium transition-all text-indigo-200 hover:text-white";
      ptBtn.className = currentLang === 'pt' ? activeCls : idleCls;
      deBtn.className = currentLang === 'de' ? activeCls : idleCls;

      document.getElementById('progress-text').innerText = `${completedStops.length} / ${stops.length} ${txt.visitedLabel}`;
      document.getElementById('lb-close').setAttribute('aria-label', txt.close);

      renderStops();
      renderToilets();
    }

    function setLanguage(lang) {
      if (currentLang !== lang) {
        currentLang = lang;
        saveStored('bcn_tour_lang_v2', lang);
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        updateUI();
        if (lightboxState) renderLightbox();
      }
    }

    function renderToilets() {
      wcMarkersGroup.clearLayers();
      const txt = uiTranslations[currentLang];
      if (!showWC) return;
      publicToilets.forEach(wc => {
        const wcIcon = L.divIcon({ className: 'wc-icon', html: '🚻', iconSize: [24, 24], iconAnchor: [12, 12] });
        L.marker(wc.coords, { icon: wcIcon })
          .bindPopup(`<b>${txt.wcPopupTitle}</b><br>${escapeHtml(wc.name)}`)
          .addTo(wcMarkersGroup);
      });
    }

    function highlightsHtml(stop, txt) {
      const list = stop.highlights || [];
      if (!list.length) return '';
      const isOpen = openDetails.has(stop.id);
      const hasImages = list.some(h => h.img);

      const items = list.map((h, idx) => {
        const t = h[currentLang];
        const imgBlock = h.img ? `
          <button onclick="openLightbox(${stop.id}, ${idx})" class="hl-img-wrap block w-full aspect-[16/10] overflow-hidden rounded-lg" aria-label="${escapeHtml(t.title)}">
            <img src="${commonsImg(h.img, 500)}" alt="${escapeHtml(t.title)}" loading="lazy" decoding="async"
                 class="w-full h-full object-cover"
                 onerror="this.parentElement.style.display='none'">
          </button>` : '';
        return `
          <figure class="space-y-2">
            ${imgBlock}
            <figcaption>
              <h4 class="font-bold text-sm text-slate-800">${escapeHtml(t.title)}</h4>
              <p class="text-xs text-slate-600 leading-relaxed mt-1">${escapeHtml(t.text)}</p>
              ${h.img ? `<p class="text-[10px] text-slate-400 mt-1">${creditHtml(h, txt)}</p>` : ''}
            </figcaption>
          </figure>`;
      }).join('');

      return `
        <button onclick="toggleDetails(${stop.id})" aria-expanded="${isOpen}"
          class="${isOpen ? 'open-btn ' : ''}mt-3 w-full flex items-center justify-between gap-2 px-3 py-2 rounded-lg bg-amber-50 border border-amber-200 text-amber-900 text-xs font-semibold hover:bg-amber-100 transition">
          <span class="flex items-center gap-2"><i data-lucide="sparkles" class="w-4 h-4"></i>${isOpen ? txt.lessLabel : txt.moreLabel} (${list.length})</span>
          <i data-lucide="chevron-down" class="chevron w-4 h-4"></i>
        </button>
        <div class="details-panel ${isOpen ? 'open' : ''} mt-3 space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <button onclick="speakStop(${stop.id}, true)" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-semibold hover:bg-indigo-700 transition">
              <i data-lucide="headphones" class="w-4 h-4"></i> ${txt.listenDetailed}
            </button>
            ${hasImages ? `<span class="text-[11px] text-slate-400">${txt.tapToEnlarge}</span>` : ''}
          </div>
          ${items}
        </div>`;
    }

    function renderStops() {
      const container = document.getElementById('stops-container');
      container.innerHTML = '';
      const txt = uiTranslations[currentLang];

      stops.forEach((stop) => {
        const isCompleted = completedStops.includes(stop.id);
        const data = stop[currentLang];
        const hasDetails = !!(stop.highlights && stop.highlights.length);

        const customIcon = L.divIcon({
          className: `custom-div-icon ${isCompleted ? 'completed' : ''} ${hasDetails ? 'has-details' : ''}`,
          html: `${stop.id}`,
          iconSize: [26, 26],
          iconAnchor: [13, 13]
        });
        if (!stopMarkers[stop.id]) {
          stopMarkers[stop.id] = L.marker(stop.coords, { icon: customIcon }).addTo(map);
          stopMarkers[stop.id].on('click', () => scrollToCard(stop.id));
        } else {
          stopMarkers[stop.id].setIcon(customIcon);
        }

        // Popup: show first highlight photo as a teaser if available
        const firstImg = hasDetails ? stop.highlights.find(h => h.img) : null;
        const popupImg = firstImg
          ? `<img src="${commonsImg(firstImg.img, 330)}" alt="" style="width:200px;height:120px;object-fit:cover;border-radius:6px;margin-top:6px" loading="lazy" onerror="this.remove()">`
          : '';
        stopMarkers[stop.id].bindPopup(`<b>${stop.id}. ${escapeHtml(data.name)}</b><br>${escapeHtml(data.shortDesc)}${popupImg}`);

        const card = document.createElement('div');
        card.id = `stop-card-${stop.id}`;
        card.className = `p-4 bg-white rounded-xl shadow-sm border ${isCompleted ? 'border-green-200 bg-green-50/30' : 'border-slate-200'} transition-all hover:shadow-md`;

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2 cursor-pointer" onclick="focusStop(${stop.id})">
            <div class="flex items-start gap-3">
              <button onclick="event.stopPropagation(); toggleStop(${stop.id})" class="mt-0.5 w-6 h-6 rounded-full border flex items-center justify-center font-bold text-xs shrink-0 ${isCompleted ? 'bg-green-500 text-white border-green-500' : 'border-slate-300 text-slate-500 hover:border-indigo-500'}" title="${txt.markVisited}" aria-label="${txt.markVisited}">
                ${isCompleted ? '✓' : stop.id}
              </button>
              <div>
                <h3 class="font-bold text-sm ${isCompleted ? 'line-through text-slate-400' : 'text-slate-800'}">${escapeHtml(data.name)}</h3>
                <p class="text-xs text-slate-500 mt-0.5">${escapeHtml(data.shortDesc)}</p>
              </div>
            </div>
            <button onclick="event.stopPropagation(); speakStop(${stop.id}, false)" class="p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg shrink-0 transition" title="${txt.audioTooltip}" aria-label="${txt.audioTooltip}">
              <i data-lucide="volume-2" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="mt-3 pt-3 border-t border-slate-100 text-xs text-slate-600 space-y-2">
            <p class="leading-relaxed">${escapeHtml(data.longDesc)}</p>

            ${data.gastro ? `
              <div class="p-2.5 bg-amber-50 border border-amber-200 rounded-lg text-amber-900 font-medium flex items-start gap-1.5">
                <span class="shrink-0">💡</span>
                <div>${escapeHtml(data.gastro)}</div>
              </div>
            ` : ''}

            ${stop.wiki ? `
              <a href="${stop.wiki}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-indigo-600 hover:underline font-semibold pt-1">
                ${txt.readMoreWiki} <i data-lucide="external-link" class="w-3 h-3"></i>
              </a>
            ` : ''}

            ${highlightsHtml(stop, txt)}
          </div>
        `;

        container.appendChild(card);
      });

      lucide.createIcons();
    }

    // ---------- Interactions ----------
    const prefersReducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Height covered by the sticky header + toolbar, so targets don't end up hidden behind them
    function stickyOffset() {
      const bar = document.getElementById('toolbar');
      return (bar ? bar.getBoundingClientRect().bottom : 120) + 12;
    }

    function scrollToElement(el) {
      const top = el.getBoundingClientRect().top + window.scrollY - stickyOffset();
      window.scrollTo({ top: Math.max(0, top), behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
    }

    // Map marker clicked -> bring its card into view and highlight it briefly
    function scrollToCard(id) {
      const card = document.getElementById(`stop-card-${id}`);
      if (!card) return;
      scrollToElement(card);
      card.classList.remove('card-flash');
      void card.offsetWidth; // restart animation if clicked twice
      card.classList.add('card-flash');
    }

    // Card header clicked -> center the map on the stop.
    // On phones the map sits above the list, so scroll back up to it.
    window.focusStop = function(id) {
      const stop = getStop(id);
      if (!stop) return;
      if (window.innerWidth < 768) {
        scrollToElement(document.getElementById('map-card'));
      }
      map.setView(stop.coords, 16);
      stopMarkers[id].openPopup();
    };

    window.toggleStop = function(id) {
      if (completedStops.includes(id)) {
        completedStops = completedStops.filter(i => i !== id);
      } else {
        completedStops.push(id);
      }
      saveStored('bcn_tour_completed_v2', completedStops);
      updateUI();
    };

    window.toggleDetails = function(id) {
      if (openDetails.has(id)) openDetails.delete(id); else openDetails.add(id);
      renderStops();
    };

    window.toggleWC = function() {
      showWC = !showWC;
      renderToilets();
      const txt = uiTranslations[currentLang];
      document.getElementById('label-wc').innerText = showWC ? txt.wcHide : txt.wcShow;
      document.getElementById('wc-toggle').className = showWC
        ? "px-3 py-2 bg-sky-50 text-sky-700 border border-sky-200 rounded-lg font-semibold flex items-center gap-2 transition active:scale-95"
        : "px-3 py-2 bg-slate-100 text-slate-400 border border-slate-200 rounded-lg font-semibold flex items-center gap-2 transition opacity-60 active:scale-95";
    };

    // ---------- Text-to-Speech ----------
    // detailed=true also reads all highlight texts of the stop.
    window.speakStop = function(id, detailed) {
      const txt = uiTranslations[currentLang];
      if (!('speechSynthesis' in window)) { alert(txt.ttsUnsupported); return; }
      if (window.speechSynthesis.speaking) { window.speechSynthesis.cancel(); return; }

      const stop = getStop(id);
      const data = stop[currentLang];
      let text = `${data.name}. ${data.longDesc}`;
      if (detailed && stop.highlights) {
        text += ' ' + stop.highlights.map(h => `${h[currentLang].title}. ${h[currentLang].text}`).join(' ');
      }
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = currentLang === 'pt' ? 'pt-BR' : 'de-DE';
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
    };

    // ---------- Lightbox ----------
    function lightboxList(stopId) {
      return getStop(stopId).highlights
        .map((h, idx) => ({ h, idx }))
        .filter(item => item.h.img);
    }

    function renderLightbox() {
      const { stopId, index } = lightboxState;
      const txt = uiTranslations[currentLang];
      const list = lightboxList(stopId);
      const pos = list.findIndex(item => item.idx === index);
      const h = list[pos].h;
      const t = h[currentLang];

      const img = document.getElementById('lb-img');
      img.src = commonsImg(h.img, 1280);
      img.alt = t.title;
      document.getElementById('lb-title').innerText = t.title;
      document.getElementById('lb-text').innerText = t.text;
      document.getElementById('lb-credit').innerHTML = creditHtml(h, txt);
      document.getElementById('lb-counter').innerText = `${pos + 1} / ${list.length}`;
      document.getElementById('lb-prev').style.visibility = list.length > 1 ? 'visible' : 'hidden';
      document.getElementById('lb-next').style.visibility = list.length > 1 ? 'visible' : 'hidden';
    }

    window.openLightbox = function(stopId, index) {
      lightboxState = { stopId, index };
      renderLightbox();
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
      document.getElementById('lb-close').focus();
    };

    window.closeLightbox = function() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
      document.getElementById('lb-img').src = '';
      lightboxState = null;
    };

    window.stepLightbox = function(dir) {
      if (!lightboxState) return;
      const list = lightboxList(lightboxState.stopId);
      const pos = list.findIndex(item => item.idx === lightboxState.index);
      const next = (pos + dir + list.length) % list.length;
      lightboxState.index = list[next].idx;
      renderLightbox();
    };

    document.addEventListener('keydown', (e) => {
      if (!lightboxState) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') stepLightbox(-1);
      if (e.key === 'ArrowRight') stepLightbox(1);
    });

    // Swipe left/right on phones; tap on dark background closes
    (function initSwipe() {
      const stage = document.getElementById('lb-stage');
      let startX = null;
      stage.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
      stage.addEventListener('touchend', e => {
        if (startX === null) return;
        const dx = e.changedTouches[0].clientX - startX;
        if (Math.abs(dx) > 50) stepLightbox(dx < 0 ? 1 : -1);
        startX = null;
      });
      stage.addEventListener('click', e => { if (e.target === stage) closeLightbox(); });
    })();

    // ---------- Live GPS ----------
    window.toggleGPS = function() {
      const btn = document.getElementById('gps-btn');
      const label = document.getElementById('label-gps');
      const txt = uiTranslations[currentLang];

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        if (userMarker) map.removeLayer(userMarker);
        userMarker = null;
        btn.classList.remove('bg-indigo-600', 'text-white');
        btn.classList.add('bg-slate-100');
        label.innerText = txt.gpsLabel;
        return;
      }

      if ('geolocation' in navigator) {
        btn.classList.add('bg-indigo-600', 'text-white');
        btn.classList.remove('bg-slate-100');
        label.innerText = txt.gpsSearching;

        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const userCoords = [pos.coords.latitude, pos.coords.longitude];
            if (!userMarker) {
              const userIcon = L.divIcon({ className: 'user-location-marker', iconSize: [16, 16], iconAnchor: [8, 8] });
              userMarker = L.marker(userCoords, { icon: userIcon })
                .addTo(map)
                .bindPopup(`<b>${uiTranslations[currentLang].userLocation}</b>`);
              map.setView(userCoords, 16);
            } else {
              userMarker.setLatLng(userCoords);
            }
            label.innerText = uiTranslations[currentLang].gpsActive;
          },
          () => {
            alert(uiTranslations[currentLang].gpsError);
            toggleGPS();
          },
          { enableHighAccuracy: true }
        );
      } else {
        alert(txt.noGps);
      }
    };

    // ---------- Init ----------
    map.fitBounds(L.latLngBounds(latLngs), { padding: [25, 25] });
    updateUI();
  </script>
</body>
</html>
