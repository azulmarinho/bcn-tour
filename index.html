<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guia Interativo de Barcelona & Audioguia</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    #map { height: 380px; width: 100%; z-index: 10; }
    @media (min-width: 768px) {
      #map { height: 100%; min-height: 550px; }
    }
    
    /* Custom Map Markers */
    .custom-div-icon {
      background: #4f46e5;
      color: white;
      border-radius: 50%;
      text-align: center;
      font-weight: bold;
      font-size: 12px;
      line-height: 26px;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .custom-div-icon.completed { background: #22c55e; }

    /* WC Marker */
    .wc-icon {
      background: #0284c7;
      color: white;
      border-radius: 8px;
      text-align: center;
      font-size: 12px;
      line-height: 22px;
      border: 2px solid white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
    }

    /* User GPS Pulsing Dot */
    .user-location-marker {
      background: #2563eb;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 0 8px rgba(37, 99, 235, 0.3);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0px rgba(37, 99, 235, 0.5); }
      70% { box-shadow: 0 0 0 12px rgba(37, 99, 235, 0); }
      100% { box-shadow: 0 0 0 0px rgba(37, 99, 235, 0); }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <!-- Header -->
  <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold flex items-center gap-2">
          <i data-lucide="map-pin"></i> Tour Barcelona
        </h1>
        <p class="text-xs text-indigo-200">Diagonal → Sagrada Família</p>
      </div>
      <div class="flex items-center gap-2">
        <span id="progress-text" class="text-xs bg-indigo-700 px-3 py-1.5 rounded-full font-semibold">0 / 26</span>
      </div>
    </div>
  </header>

  <!-- Controls Bar -->
  <div class="bg-white border-b border-slate-200 p-3 sticky top-[60px] z-40 shadow-sm">
    <div class="max-w-5xl mx-auto flex flex-wrap gap-2 justify-between items-center">
      <!-- GPS Toggle Button -->
      <button id="gps-btn" onclick="toggleGPS()" class="px-3 py-1.5 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 border border-slate-300 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
        <i data-lucide="navigation" class="w-4 h-4"></i> Localização GPS
      </button>

      <!-- Filter Toggles -->
      <div class="flex items-center gap-2">
        <button id="wc-toggle" onclick="toggleWC()" class="px-3 py-1.5 bg-sky-50 text-sky-700 border border-sky-200 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
          <i data-lucide="bath" class="w-4 h-4"></i> 🚻 Mostrar Banheiros
        </button>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 flex flex-col md:flex-row gap-4">
    
    <!-- Left Column: Map -->
    <div class="w-full md:w-1/2 flex flex-col gap-4">
      <div class="bg-white rounded-xl shadow-md overflow-hidden border border-slate-200 sticky top-[120px]">
        <div id="map"></div>
        <div class="p-3 bg-slate-100 border-t border-slate-200 text-xs text-slate-600 flex justify-between items-center">
          <span><i data-lucide="footprints" class="inline w-3.5 h-3.5"></i> ~12-14 km</span>
          <span><i data-lucide="clock" class="inline w-3.5 h-3.5"></i> ~7-9 horas</span>
        </div>
      </div>
    </div>

    <!-- Right Column: Interactive List -->
    <div class="w-full md:w-1/2 flex flex-col gap-3" id="stops-container">
      <!-- Cards são renderizados aqui via JavaScript -->
    </div>

  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Dados da Rota
    const stops = [
      { id: 1, name: "Estação de Metrô Diagonal", coords: [41.3965, 2.1588], shortDesc: "Ponto de partida no topo do Passeig de Gràcia.", longDesc: "Aqui começa o seu roteiro a pé. O Passeig de Gràcia é a avenida mais famosa de Barcelona para admirar a arquitetura do Modernismo Catalão.", wiki: "https://pt.wikipedia.org/wiki/Passeig_de_Gr%C3%A0cia" },
      { id: 2, name: "Casa Milà (La Pedrera)", coords: [41.3954, 2.1612], shortDesc: "Famoso edifício residencial de Gaudí.", longDesc: "Devido à sua fachada de pedra ondulada, é conhecida como 'La Pedrera' (A Pedreira). A estrutura não possui paredes mestras e apoia-se inteiramente em colunas e arcos.", wiki: "https://pt.wikipedia.org/wiki/Casa_Mil%C3%A0", gastro: "☕ Café de la Pedrera – Café histórico no térreo para um café expresso rápido." },
      { id: 3, name: "Casa Batlló", coords: [41.3917, 2.1649], shortDesc: "O castelo de fadas de Antoni Gaudí.", longDesc: "A fachada colorida representa o mosaico da lenda de São Jorge. O teto escamosado lembra o lombo de um dragão.", wiki: "https://pt.wikipedia.org/wiki/Casa_Batll%C3%B3" },
      { id: 4, name: "El Nacional", coords: [41.390248, 2.167854], shortDesc: "Espaço gastronômico icônico.", longDesc: "Antigo edifício industrial do século XIX restaurado, reunindo quatro restaurantes e bares sob um teto de vidro e ferro.", gastro: "🍷 Tapas & Cava Bar – Perfeito para um aperitivo ou taça de Cava no meio da manhã." },
      { id: 5, name: "Plaça de Catalunya", coords: [41.3870, 2.1700], shortDesc: "A praça principal no centro da cidade.", longDesc: "Ponto de encontro central que conecta o centro histórico ao moderno bairro de Eixample.", wiki: "https://pt.wikipedia.org/wiki/Pra%C3%A7a_da_Catalunha" },
      { id: 6, name: "El món neix en cada bes", coords: [41.3847, 2.1751], shortDesc: "Mosaico 'O Beijo' na Plaça d'Isidre Nonell.", longDesc: "Criado pelo artista Joan Fontcuberta com 4.000 fotos enviadas por moradores locais sob o tema 'Momentos de Liberdade'.", wiki: "https://es.wikipedia.org/wiki/El_mundo_nace_en_cada_beso" },
      { id: 7, name: "Catedral de Barcelona", coords: [41.3839, 2.1762], shortDesc: "Catedral gótica principal.", longDesc: "No belo claustro ajardinado vivem há séculos exatamente 13 gansos brancos, representando a idade de Santa Eulália.", wiki: "https://pt.wikipedia.org/wiki/Catedral_de_Barcelona" },
      { id: 8, name: "Casa de l'Ardiaca", coords: [41.3837, 2.1756], shortDesc: "Antiga casa do Arquidiácono.", longDesc: "Entre para ver o encantador pátio interno. Na porta fica a famosa caixa de correio em mármore decorada com uma tartaruga e andorinhas.", wiki: "https://ca.wikipedia.org/wiki/Casa_de_l%27Ardiaca" },
      { id: 9, name: "Plaça de Sant Felip Neri", coords: [41.383413, 2.175122], shortDesc: "Praça histórica escondida no Bairro Gótico.", longDesc: "Um local calmo com história marcante: as marcas nas paredes da igreja são resultantes de um bombardeio em 1938 durante a Guerra Civil Espanhola." },
      { id: 10, name: "Pont del Bisbe", coords: [41.383301, 2.176431], shortDesc: "Ponte neogótica fotogênica.", longDesc: "Conecta os edifícios governamentais na ruela Carrer del Bisbe. Há uma caveira esculpida de forma misteriosa na parte inferior da ponte." },
      { id: 11, name: "Plaça de Sant Jaume", coords: [41.3828, 2.1768], shortDesc: "O centro político da Catalunha.", longDesc: "Aqui ficam frente a frente a Prefeitura de Barcelona (Ajuntament) e o Palácio da Generalitat de Catalunya." },
      { id: 12, name: "Plaça Reial", coords: [41.3798, 2.1752], shortDesc: "Praça com palmeiras e arcadas.", longDesc: "Observe os dois grandes postes de iluminação na praça: estão entre os primeiros trabalhos projetados pelo jovem Antoni Gaudí.", wiki: "https://pt.wikipedia.org/wiki/Pra%C3%A7a_Real" },
      { id: 13, name: "Mercat de la Boqueria / La Rambla", coords: [41.3817, 2.1715], shortDesc: "O mercado público mais famoso da Europa.", longDesc: "Um espetáculo de cores e aromas com frutas frescas, presunto ibérico serrano, frutos do mar e tapas.", wiki: "https://pt.wikipedia.org/wiki/Mercado_da_Boqueria", gastro: "🍍 Dica de Suco: Experimente um suco fresco de pitaia ou manga por 2–3 € nas bancas!" },
      { id: 14, name: "Monumento a Colombo", coords: [41.3758, 2.1778], shortDesc: "Coluna de 60 metros com mirante.", longDesc: "Construído para a Exposição Universal de 1888. A estátua de Cristóvão Colombo aponta em direção ao mar.", wiki: "https://pt.wikipedia.org/wiki/Monumento_a_Colombo" },
      { id: 15, name: "Rambla de Mar", coords: [41.3768, 2.1802], shortDesc: "Passarela de madeira ondulada sobre a água.", longDesc: "Conecta até o shopping Maremagnum e se abre para a passagem de grandes veleiros no porto." },
      { id: 16, name: "Embarque Bus Nàutic", coords: [41.375283, 2.178901], shortDesc: "Barco solar até a área do Hotel W.", longDesc: "Uma travessia rápida e relaxante pelo porto por cerca de 1,90 €, economizando caminhada e oferecendo uma vista linda da cidade." },
      { id: 17, name: "Honest Greens Barceloneta", coords: [41.3689, 2.1901], shortDesc: "Excelente opção para o almoço.", longDesc: "Restaurante muito popular com bowls saudáveis, pratos frescos e limonadas artesanais à beira-mar.", gastro: "🥗 Dica: Experimente o 'Latin Grill' ou uma das bowls sazonais com abacate." },
      { id: 18, name: "Praia da Barceloneta", coords: [41.375101, 2.190063], shortDesc: "A praia urbana mais famosa.", longDesc: "Caminhada agradável pelo calçadão observando o mar e o marcante Hotel W em formato de vela." },
      { id: 19, name: "Museu d'Història de Catalunya", coords: [41.3810, 2.1862], shortDesc: "Armazém histórico do porto (Palau de Mar).", longDesc: "No último andar do prédio há um bar no terraço com vista panorâmica espetacular da marina." },
      { id: 20, name: "Santa Maria del Mar", coords: [41.3836, 2.1821], shortDesc: "A 'Catedral do Mar'.", longDesc: "Uma obra-prima do gótico catalão, construída pelos marinheiros e trabalhadores do bairro no século XIV.", wiki: "https://pt.wikipedia.org/wiki/Bas%C3%ADlica_de_Santa_Maria_do_Mar" },
      { id: 21, name: "Ruas de El Born", coords: [41.3849, 2.1835], shortDesc: "Bairro charmoso e criativo.", longDesc: "Passeie pelas ruelas históricas perto da Carrer de Montcada (Museu Picasso) e do Passeig del Born.", gastro: "🍸 Dica Speakeasy: 'Paradiso' (Carrer de Rera Palau 4) – Drinks premiados escondidos atrás de uma lanchonete de pastrami!" },
      { id: 22, name: "El Born Centre de Cultura i Memòria", coords: [41.3855, 2.1849], shortDesc: "Ruínas sob o antigo mercado de ferro.", longDesc: "É possível visualizar gratuitamente as ruínas arqueológicas das casas destruídas em 1714." },
      { id: 23, name: "Parc de la Ciutadella", coords: [41.3882, 2.1874], shortDesc: "O grande parque urbano da cidade.", longDesc: "Conta com lago para pedalinhos, palmeiras e a imponente fonte 'Cascada Monumental', que teve participação do jovem Gaudí.", wiki: "https://pt.wikipedia.org/wiki/Parque_da_Cidadela" },
      { id: 24, name: "Arc de Triomf", coords: [41.3911, 2.1806], shortDesc: "Arco do triunfo em tijolos vermelhos.", longDesc: "Construído como portão de entrada principal para a Exposição Universal de 1888.", wiki: "https://pt.wikipedia.org/wiki/Arco_do_Triunfo_(Barcelona)" },
      { id: 25, name: "La Monumental", coords: [41.4005, 2.1798], shortDesc: "Antiga arena de touros.", longDesc: "Construída em estilo neo-mourisco. Hoje é utilizada para eventos culturais e concertos musicais." },
      { id: 26, name: "Sagrada Família", coords: [41.4036, 2.1744], shortDesc: "O grande encerramento do roteiro.", longDesc: "A grande obra da vida de Gaudí e o símbolo máximo de Barcelona. Combina formas da natureza com arquitetura monumental.", wiki: "https://pt.wikipedia.org/wiki/Templo_Expiat%C3%B3rio_da_Sagrada_Fam%C3%ADlia" }
    ];

    // Banheiros Públicos na Rota
    const publicToilets = [
      { name: "WC Metrô Diagonal", coords: [41.3966, 2.1585] },
      { name: "WC El Nacional / Passeig de Gràcia", coords: [41.3901, 2.1680] },
      { name: "WC Público Plaça Catalunya", coords: [41.3868, 2.1702] },
      { name: "WC Mercat de la Boqueria", coords: [41.3815, 2.1712] },
      { name: "WC Maremagnum / Porto", coords: [41.3761, 2.1808] },
      { name: "WC Praia da Barceloneta", coords: [41.3762, 2.1915] },
      { name: "WC Parc de la Ciutadella", coords: [41.3875, 2.1865] },
      { name: "WC Sagrada Família (Praça)", coords: [41.4032, 2.1740] }
    ];

    let completedStops = JSON.parse(localStorage.getItem('bcn_tour_completed') || '[]');
    let showWC = true;
    let userMarker = null;
    let watchId = null;

    // Inicializar Mapa
    const map = L.map('map').setView([41.385, 2.175], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const latLngs = stops.map(s => s.coords);
    L.polyline(latLngs, { color: '#4f46e5', weight: 4, opacity: 0.7, dashArray: '6, 8' }).addTo(map);

    const markers = {};
    const wcMarkersGroup = L.layerGroup().addTo(map);

    // Renderizar Banheiros
    function renderToilets() {
      wcMarkersGroup.clearLayers();
      if (showWC) {
        publicToilets.forEach(wc => {
          const wcIcon = L.divIcon({
            className: 'wc-icon',
            html: '🚻',
            iconSize: [24, 24],
            iconAnchor: [12, 12]
          });
          L.marker(wc.coords, { icon: wcIcon })
            .bindPopup(`<b>Banheiro Público</b><br>${wc.name}`)
            .addTo(wcMarkersGroup);
        });
      }
    }
    renderToilets();

    // Renderizar Lista e Marcadores
    const container = document.getElementById('stops-container');

    stops.forEach((stop) => {
      const isCompleted = completedStops.includes(stop.id);

      const customIcon = L.divIcon({
        className: `custom-div-icon ${isCompleted ? 'completed' : ''}`,
        html: `${stop.id}`,
        iconSize: [26, 26],
        iconAnchor: [13, 13]
      });

      const marker = L.marker(stop.coords, { icon: customIcon })
        .addTo(map)
        .bindPopup(`<b>${stop.id}. ${stop.name}</b><br>${stop.shortDesc}`);
      
      markers[stop.id] = marker;

      const card = document.createElement('div');
      card.className = `p-4 bg-white rounded-xl shadow-sm border ${isCompleted ? 'border-green-200 bg-green-50/30' : 'border-slate-200'} transition-all hover:shadow-md`;

      card.innerHTML = `
        <div class="flex items-start justify-between gap-2 cursor-pointer" onclick="focusStop(${stop.id})">
          <div class="flex items-start gap-3">
            <button onclick="event.stopPropagation(); toggleStop(${stop.id})" class="mt-0.5 w-6 h-6 rounded-full border flex items-center justify-center font-bold text-xs shrink-0 ${isCompleted ? 'bg-green-500 text-white border-green-500' : 'border-slate-300 text-slate-500 hover:border-indigo-500'}">
              ${isCompleted ? '✓' : stop.id}
            </button>
            <div>
              <h3 class="font-bold text-sm ${isCompleted ? 'line-through text-slate-400' : 'text-slate-800'}">${stop.name}</h3>
              <p class="text-xs text-slate-500 mt-0.5">${stop.shortDesc}</p>
            </div>
          </div>
          <button onclick="event.stopPropagation(); toggleSpeech('${stop.name}. ${stop.longDesc.replace(/'/g, "\\'")}')" class="p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg shrink-0 transition" title="Ouvir audioguia">
            <i data-lucide="volume-2" class="w-4 h-4"></i>
          </button>
        </div>

        <div class="mt-3 pt-3 border-t border-slate-100 text-xs text-slate-600 space-y-2">
          <p class="leading-relaxed">${stop.longDesc}</p>
          
          ${stop.gastro ? `
            <div class="p-2.5 bg-amber-50 border border-amber-200 rounded-lg text-amber-900 font-medium">
              ${stop.gastro}
            </div>
          ` : ''}

          ${stop.wiki ? `
            <a href="${stop.wiki}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-indigo-600 hover:underline font-semibold pt-1">
              Ler mais na Wikipedia <i data-lucide="external-link" class="w-3 h-3"></i>
            </a>
          ` : ''}
        </div>
      `;

      container.appendChild(card);
    });

    map.fitBounds(L.latLngBounds(latLngs), { padding: [25, 25] });

    // Focar no Ponto no Mapa
    window.focusStop = function(id) {
      const stop = stops.find(s => s.id === id);
      if (stop) {
        map.setView(stop.coords, 16);
        markers[id].openPopup();
      }
    };

    // Alternar Concluído
    window.toggleStop = function(id) {
      if (completedStops.includes(id)) {
        completedStops = completedStops.filter(i => i !== id);
      } else {
        completedStops.push(id);
      }
      localStorage.setItem('bcn_tour_completed', JSON.stringify(completedStops));
      location.reload();
    };

    // Alternar Camada de Banheiros
    window.toggleWC = function() {
      showWC = !showWC;
      renderToilets();
      const btn = document.getElementById('wc-toggle');
      btn.className = showWC 
        ? "px-3 py-1.5 bg-sky-50 text-sky-700 border border-sky-200 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition"
        : "px-3 py-1.5 bg-slate-100 text-slate-400 border border-slate-200 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition opacity-60";
    };

    // Audioguia (Text-to-Speech)
    window.toggleSpeech = function(text) {
      if ('speechSynthesis' in window) {
        if (window.speechSynthesis.speaking) {
          window.speechSynthesis.cancel();
          return;
        }
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      } else {
        alert("O seu navegador não suporta a função de áudio.");
      }
    };

    // Rastreamento GPS ao vivo
    window.toggleGPS = function() {
      const btn = document.getElementById('gps-btn');
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        if (userMarker) map.removeLayer(userMarker);
        btn.classList.remove('bg-indigo-600', 'text-white');
        btn.classList.add('bg-slate-100');
        btn.innerHTML = '<i data-lucide="navigation" class="w-4 h-4"></i> Localização GPS';
        lucide.createIcons();
        return;
      }

      if ('geolocation' in navigator) {
        btn.classList.add('bg-indigo-600', 'text-white');
        btn.classList.remove('bg-slate-100');
        btn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Buscando sinal...';
        lucide.createIcons();

        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const userCoords = [pos.coords.latitude, pos.coords.longitude];
            
            if (!userMarker) {
              const userIcon = L.divIcon({
                className: 'user-location-marker',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
              });
              userMarker = L.marker(userCoords, { icon: userIcon }).addTo(map).bindPopup("<b>Sua localização atual</b>");
              map.setView(userCoords, 16);
            } else {
              userMarker.setLatLng(userCoords);
            }
            btn.innerHTML = '<i data-lucide="navigation-2" class="w-4 h-4"></i> GPS Ativo';
            lucide.createIcons();
          },
          (err) => {
            alert("Não foi possível obter a sua localização GPS.");
            toggleGPS();
          },
          { enableHighAccuracy: true }
        );
      } else {
        alert("O seu navegador não suporta geolocalização.");
      }
    };

    // Contador de Progresso
    document.getElementById('progress-text').innerText = `${completedStops.length} / ${stops.length} visitados`;

    // Renderizar Ícones
    lucide.createIcons();
  </script>
</body>
</html>
