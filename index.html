<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guia de Caminhada em Barcelona</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    #map { height: 350px; width: 100%; z-index: 10; }
    @media (min-width: 768px) {
      #map { height: 100%; min-height: 500px; }
    }
    .custom-div-icon {
      background: #ef4444;
      color: white;
      border-radius: 50%;
      text-align: center;
      font-weight: bold;
      font-size: 12px;
      line-height: 24px;
      border: 2px solid white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    .custom-div-icon.completed {
      background: #22c55e;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <!-- Header -->
  <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold flex items-center gap-2">
          <i data-lucide="map-pin"></i> Tour Barcelona
        </h1>
        <p class="text-xs text-indigo-200">Diagonal → Sagrada Família</p>
      </div>
      <div class="text-right">
        <span id="progress-text" class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full font-semibold">0 / 26 concluídos</span>
      </div>
    </div>
  </header>

  <!-- Main Layout -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 flex flex-col md:flex-row gap-4">
    
    <!-- Left Column: Map & Controls -->
    <div class="w-full md:w-1/2 flex flex-col gap-4">
      <!-- Map Container -->
      <div class="bg-white rounded-xl shadow-md overflow-hidden border border-slate-200 sticky top-20">
        <div id="map"></div>
        <div class="p-3 bg-slate-100 border-t border-slate-200 text-xs text-slate-600 flex justify-between items-center">
          <span><i data-lucide="footprints" class="inline w-3 h-3"></i> ~12-14 km</span>
          <span><i data-lucide="clock" class="inline w-3 h-3"></i> 7-9 horas</span>
        </div>
      </div>
    </div>

    <!-- Right Column: Timeline / List -->
    <div class="w-full md:w-1/2 flex flex-col gap-3" id="stops-container">
      <!-- Stops injected by JS -->
    </div>

  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Rotas & Pontos corrigidos com as coordenadas exatas enviadas
    const stops = [
      { id: 1, name: "Estação de Metrô Diagonal", coords: [41.3965, 2.1588], desc: "Ponto de partida no topo do Passeig de Gràcia." },
      { id: 2, name: "Casa Milà (La Pedrera)", coords: [41.3954, 2.1612], desc: "Obra-prima de Gaudí com fachada de pedra ondulada." },
      { id: 3, name: "Casa Batlló", coords: [41.3917, 2.1649], desc: "Fachada colorida inspirada na lenda de São Jorge." },
      { id: 4, name: "El Nacional", coords: [41.390248, 2.167854], desc: "Espaço gastronômico espetacular sob arquitetura industrial." },
      { id: 5, name: "Plaça de Catalunya", coords: [41.3870, 2.1700], desc: "A praça central conectando o centro histórico ao Eixample." },
      { id: 6, name: "El món neix en cada bes", coords: [41.3847, 2.1751], desc: "O famoso mosaico 'O Beijo' feito de 4.000 fotos locais." },
      { id: 7, name: "Catedral de Barcelona", coords: [41.3839, 2.1762], desc: "Catedral gótica com claustro habitado por 13 gansos brancos." },
      { id: 8, name: "Casa de l'Ardiaca", coords: [41.3837, 2.1756], desc: "Pátio encantador com a famosa caixa de correio da tartaruga." },
      { id: 9, name: "Plaça de Sant Felip Neri", coords: [41.383413, 2.175122], desc: "Praça tranquila com marcas históricas da Guerra Civil nas paredes." },
      { id: 10, name: "Pont del Bisbe", coords: [41.383301, 2.176431], desc: "A icônica ponte neogótica no Bairro Gótico." },
      { id: 11, name: "Plaça de Sant Jaume", coords: [41.3828, 2.1768], desc: "O centro político da Catalunha com a Prefeitura e a Generalitat." },
      { id: 12, name: "Plaça Reial", coords: [41.3798, 2.1752], desc: "Praça com palmeiras e postes projetados por Gaudí." },
      { id: 13, name: "Mercat de la Boqueria / La Rambla", coords: [41.3817, 2.1715], desc: "Mercado de produtos frescos e snacks na famosa avenida." },
      { id: 14, name: "Monumento a Colombo", coords: [41.3758, 2.1778], desc: "Mirante e estátua ao final das Ramblas." },
      { id: 15, name: "Rambla de Mar", coords: [41.3768, 2.1802], desc: "Passarela de madeira sobre as águas do porto." },
      { id: 16, name: "Embarque Bus Nàutic", coords: [41.375283, 2.178901], desc: "Travessia de barco solar até a área do Hotel W." },
      { id: 17, name: "Honest Greens Barceloneta", coords: [41.3689, 2.1901], desc: "Parada perfeita para almoço saudável à beira-mar." },
      { id: 18, name: "Praia da Barceloneta", coords: [41.375101, 2.190063], desc: "Caminhada relaxante pela orla da praia." },
      { id: 19, name: "Museu d'Història de Catalunya", coords: [41.3810, 2.1862], desc: "Localizado no prédio histórico Palau de Mar." },
      { id: 20, name: "Basílica de Santa Maria del Mar", coords: [41.3836, 2.1821], desc: "A célebre 'Catedral do Mar' em estilo gótico catalão." },
      { id: 21, name: "Ruas de El Born (Passeig del Born)", coords: [41.3849, 2.1835], desc: "Bairro charmoso com cafés, boutiques e o Museu Picasso." },
      { id: 22, name: "El Born Centre de Cultura i Memòria", coords: [41.3855, 2.1849], desc: "Mercado antigo de ferro com ruínas do século XVIII." },
      { id: 23, name: "Parc de la Ciutadella", coords: [41.3882, 2.1874], desc: "Parque verde com lago e a monumental fonte Cascada." },
      { id: 24, name: "Arc de Triomf", coords: [41.3911, 2.1806], desc: "Arco do triunfo em tijolos vermelhos de 1888." },
      { id: 25, name: "La Monumental", coords: [41.4005, 2.1798], desc: "Antiga arena de touros em estilo neo-mourisco." },
      { id: 26, name: "Sagrada Família", coords: [41.4036, 2.1744], desc: "O grande encerramento no templo inacabado de Gaudí." }
    ];

    let completedStops = JSON.parse(localStorage.getItem('bcn_completed') || '[]');

    // Initialize Map
    const map = L.map('map').setView([41.385, 2.175], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const markers = {};
    const latLngs = stops.map(s => s.coords);

    // Draw Route Polyline
    L.polyline(latLngs, { color: '#4f46e5', weight: 4, opacity: 0.7, dashArray: '8, 8' }).addTo(map);

    // Render Markers & List Items
    const container = document.getElementById('stops-container');

    stops.forEach((stop) => {
      const isCompleted = completedStops.includes(stop.id);

      // Create Custom Marker Icon
      const customIcon = L.divIcon({
        className: `custom-div-icon ${isCompleted ? 'completed' : ''}`,
        html: `${stop.id}`,
        iconSize: [26, 26],
        iconAnchor: [13, 13]
      });

      const marker = L.marker(stop.coords, { icon: customIcon })
        .addTo(map)
        .bindPopup(`<b>${stop.id}. ${stop.name}</b><br>${stop.desc}`);
      
      markers[stop.id] = marker;

      // Create Card UI
      const card = document.createElement('div');
      card.className = `p-3.5 bg-white rounded-xl shadow-sm border ${isCompleted ? 'border-green-200 bg-green-50/40' : 'border-slate-200'} flex items-start gap-3 transition-all hover:shadow-md cursor-pointer`;
      card.onclick = () => {
        map.setView(stop.coords, 16);
        marker.openPopup();
      };

      card.innerHTML = `
        <button onclick="event.stopPropagation(); toggleStop(${stop.id})" class="mt-0.5 w-6 h-6 rounded-full border flex items-center justify-center font-bold text-xs shrink-0 ${isCompleted ? 'bg-green-500 text-white border-green-500' : 'border-slate-300 text-slate-500 hover:border-indigo-500'}">
          ${isCompleted ? '✓' : stop.id}
        </button>
        <div class="flex-1">
          <h3 class="font-bold text-sm ${isCompleted ? 'line-through text-slate-400' : 'text-slate-800'}">${stop.name}</h3>
          <p class="text-xs text-slate-500 mt-0.5">${stop.desc}</p>
        </div>
      `;

      container.appendChild(card);
    });

    // Fit map bounds to markers
    map.fitBounds(L.latLngBounds(latLngs), { padding: [20, 20] });

    // Toggle Completed Status
    window.toggleStop = function(id) {
      if (completedStops.includes(id)) {
        completedStops = completedStops.filter(item => item !== id);
      } else {
        completedStops.push(id);
      }
      localStorage.setItem('bcn_completed', JSON.stringify(completedStops));
      location.reload();
    };

    // Update Progress Indicator
    document.getElementById('progress-text').innerText = `${completedStops.length} / ${stops.length} concluídos`;

    // Initialize Lucide Icons
    lucide.createIcons();
  </script>
</body>
</html>
