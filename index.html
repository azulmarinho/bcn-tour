<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#13253F">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22%2313253F%22/%3E%3Cg%20transform%3D%22translate%2810%2010%29%20scale%28.8%29%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23EDA526%22%20stroke-width%3D%228%22%3E%3Ccircle%20cx%3D%2231%22%20cy%3D%2231%22%20r%3D%2219%22/%3E%3Ccircle%20cx%3D%2269%22%20cy%3D%2231%22%20r%3D%2219%22/%3E%3Ccircle%20cx%3D%2231%22%20cy%3D%2269%22%20r%3D%2219%22/%3E%3Ccircle%20cx%3D%2269%22%20cy%3D%2269%22%20r%3D%2219%22/%3E%3C/g%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2217%22%20fill%3D%22%2313253F%22%20stroke%3D%22%23EDA526%22%20stroke-width%3D%228%22/%3E%3C/g%3E%3C/svg%3E">
  <title>Barcelona a pé · Roteiros & Audioguia</title>

  <!-- Fonts: Young Serif for names and headings, Figtree for everything else -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Colour and type tokens. "brand" is the cobalt of Barcelona's tiles,
    // "stone" the grey-green of the hexagonal pavement on Passeig de Gràcia.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#13253F',
            brand: { 50: '#EEF4FB', 100: '#D8E6F6', 200: '#B3CDEC', 300: '#82ABDD', 400: '#4F86CB', 500: '#2D6AB8', 600: '#1F57A0', 700: '#1A4884', 800: '#173B6B', 900: '#142F55' },
            stone: { 50: '#F5F7F6', 100: '#ECF0EE', 200: '#DDE4E1', 300: '#C5CFCB', 400: '#97A5A0', 500: '#6E7D78', 600: '#55625E' },
            saffron: { 50: '#FDF6E7', 100: '#FAE9C2', 200: '#F5D68C', 400: '#EDA526', 600: '#B97A0C', 800: '#6E4706' },
            leaf: { 50: '#EAF6EF', 100: '#CDEBD9', 500: '#2F8A5B', 600: '#25724A' }
          },
          fontFamily: {
            sans: ['Figtree', 'system-ui', 'sans-serif'],
            display: ['"Young Serif"', 'Georgia', 'serif']
          }
        }
      }
    };
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --ink: #13253F;
      --brand: #1F57A0;
      --stone: #DDE4E1;
      --saffron: #EDA526;
      --leaf: #2F8A5B;
      --coral: #D9483B;
      --teal: #0C8C99;
      --bus: #C77C0A;
      --header-h: 60px;
      --bottom-nav-h: 0px;
    }
    html { -webkit-text-size-adjust: 100%; }
    body { background: #F2F5F4; color: var(--ink); }

    /* Pavement pattern with the flower tile (generated in JS, see paintTiles) */
    .tile-bg { background-color: #E7ECEA; background-image: var(--tile-light); background-size: 64px 64px; }
    .tile-bg-dark { background-color: var(--ink); background-image: var(--tile-dark); background-size: 64px 64px; }

    /* Views */
    .view { display: none; }
    .view.active { display: block; }

    /* Map */
    #map { height: 42vh; min-height: 260px; width: 100%; z-index: 10; background: #dfe6e3; }
    @media (min-width: 768px) {
      #map-card { position: sticky; top: var(--map-top, 140px); }
      #map { height: calc(100vh - var(--map-top, 140px) - 56px); min-height: 440px; }
    }
    .leaflet-popup-content { font-family: Figtree, system-ui, sans-serif; }
    .leaflet-popup-content b { font-family: "Young Serif", Georgia, serif; font-weight: 400; font-size: 15px; }

    /* Map markers */
    .stop-pin {
      background: var(--ink); color: #fff; border: 2px solid #fff; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font: 600 12px/1 Figtree, system-ui, sans-serif;
      box-shadow: 0 1px 4px rgba(19, 37, 63, .45);
    }
    .stop-pin.has-details { box-shadow: 0 0 0 3px var(--saffron), 0 1px 4px rgba(19, 37, 63, .45); }
    .stop-pin.completed { background: var(--leaf); }
    .place-pin {
      border: 2px solid #fff; border-radius: 50%; box-shadow: 0 1px 4px rgba(19, 37, 63, .45);
      display: flex; align-items: center; justify-content: center; color: #fff; font: 700 11px/1 Figtree, sans-serif;
    }
    .place-pin.selected { outline: 3px solid var(--ink); outline-offset: 1px; }
    .wc-pin {
      background: #fff; color: var(--brand); border: 2px solid var(--brand); border-radius: 6px;
      display: flex; align-items: center; justify-content: center; font: 700 10px/1 Figtree, sans-serif;
      box-shadow: 0 1px 3px rgba(19, 37, 63, .3);
    }

    /* User GPS dot */
    .user-location-marker {
      background: #2563eb; border: 3px solid white; border-radius: 50%;
      box-shadow: 0 0 0 8px rgba(37, 99, 235, 0.3); animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0px rgba(37, 99, 235, 0.5); }
      70% { box-shadow: 0 0 0 12px rgba(37, 99, 235, 0); }
      100% { box-shadow: 0 0 0 0px rgba(37, 99, 235, 0); }
    }

    /* Details panel open/close */
    .details-panel { display: none; }
    .details-panel.open { display: block; }
    .chevron { transition: transform 0.2s ease; }
    .open-btn .chevron { transform: rotate(180deg); }

    .hl-img-wrap { background: var(--stone); }
    .hl-img-wrap img { transition: transform 0.3s ease; }
    .hl-img-wrap:hover img { transform: scale(1.03); }

    /* Card selected on the map: short saffron glow */
    @keyframes cardFlash {
      0%   { box-shadow: 0 0 0 0 rgba(237, 165, 38, 0); }
      15%  { box-shadow: 0 0 0 4px rgba(237, 165, 38, 0.9); }
      100% { box-shadow: 0 0 0 0 rgba(237, 165, 38, 0); }
    }
    .card-flash { animation: cardFlash 2s ease-out; }

    /* Card of the place you are standing at (GPS) */
    .is-near { outline: 3px solid #2563eb; outline-offset: 2px; }
    .is-near::before {
      content: attr(data-near-label);
      display: inline-block; margin-bottom: 8px; padding: 2px 8px; border-radius: 999px;
      background: #2563eb; color: #fff; font-size: 11px; font-weight: 700;
    }

    /* Horizontal chip rows scroll without a visible scrollbar */
    .chip-row { scrollbar-width: none; }
    .chip-row::-webkit-scrollbar { display: none; }

    /* Small map on the tour cards: not draggable, a tap opens the tour */
    .mini-map { cursor: pointer; }
    .mini-map .leaflet-control-attribution { font-size: 9px; }

    /* Hero headline: set large, tight, with the tile showing through the counter of the type */
    .hero-title { font-family: "Young Serif", Georgia, serif; line-height: .95; letter-spacing: -.01em; }

    /* Lightbox */
    #lightbox { display: none; }
    #lightbox.open { display: flex; }

    /* Toast */
    #toast { transition: opacity .2s ease, transform .2s ease; opacity: 0; transform: translate(-50%, 8px); pointer-events: none; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* Phones: navigation sits at the bottom, within thumb reach */
    @media (max-width: 767px) {
      :root { --bottom-nav-h: calc(60px + env(safe-area-inset-bottom, 0px)); }
      body { padding-bottom: var(--bottom-nav-h); }
    }
    #near-banner { bottom: var(--bottom-nav-h); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased">

  <!-- Header -->
  <header id="app-header" class="sticky top-0 z-50 bg-ink text-white">
    <div class="max-w-6xl mx-auto px-4 h-[60px] flex items-center justify-between gap-4">
      <a href="#tours" class="flex items-center gap-2.5 min-w-0" aria-label="Barcelona">
        <!-- Logo: the "panot de flor", the flower tile of Barcelona's pavements -->
        <svg viewBox="0 0 100 100" class="w-8 h-8 shrink-0" aria-hidden="true">
          <g fill="none" stroke="#EDA526" stroke-width="7">
            <circle cx="31" cy="31" r="19"/><circle cx="69" cy="31" r="19"/>
            <circle cx="31" cy="69" r="19"/><circle cx="69" cy="69" r="19"/>
          </g>
          <circle cx="50" cy="50" r="17" fill="#13253F" stroke="#EDA526" stroke-width="7"/>
        </svg>
        <span class="font-display text-xl leading-none truncate">Barcelona</span>
      </a>

      <nav class="hidden md:flex items-center gap-1 bg-white/10 rounded-full p-1" aria-label="Main">
        <button data-nav="tours" onclick="go('tours')" class="nav-btn px-4 py-1.5 rounded-full text-sm font-semibold transition flex items-center gap-2">
          <i data-lucide="route" class="w-4 h-4"></i><span class="nav-label-tours">Roteiros</span>
        </button>
        <button data-nav="explore" onclick="go('explore')" class="nav-btn px-4 py-1.5 rounded-full text-sm font-semibold transition flex items-center gap-2">
          <i data-lucide="map" class="w-4 h-4"></i><span class="nav-label-explore">Explorar</span>
        </button>
      </nav>

      <div class="flex items-center bg-white/10 p-1 rounded-full" role="group" aria-label="Sprache / Idioma">
        <button id="lang-pt-btn" onclick="setLanguage('pt')" class="px-2.5 py-1 rounded-full text-xs font-semibold transition" title="Português (Brasil)">PT</button>
        <button id="lang-de-btn" onclick="setLanguage('de')" class="px-2.5 py-1 rounded-full text-xs font-semibold transition" title="Deutsch">DE</button>
      </div>
    </div>
  </header>

  <!-- ===== View: tour overview ===== -->
  <section id="view-tours" class="view" aria-labelledby="hero-title">
    <div class="tile-bg-dark text-white">
      <div class="max-w-6xl mx-auto px-4 pt-10 pb-24 md:pt-16 md:pb-32">
        <h1 id="hero-title" class="hero-title text-[3.2rem] sm:text-7xl md:text-8xl max-w-3xl"></h1>
        <p id="hero-text" class="mt-5 max-w-xl text-base md:text-lg text-white/80 leading-relaxed"></p>
      </div>
    </div>
    <div id="tour-list" class="max-w-6xl mx-auto px-4 -mt-16 md:-mt-20 pb-12 space-y-6"></div>
  </section>

  <!-- ===== View: map (used by "explore" and by a running tour) ===== -->
  <section id="view-map" class="view">
    <!-- Tour head (only while a tour is open) -->
    <div id="tour-head" class="hidden bg-white border-b border-stone-200">
      <div class="max-w-6xl mx-auto px-4 pt-4 pb-5">
        <button onclick="go('tours')" class="inline-flex items-center gap-1.5 text-sm font-semibold text-brand-600 hover:text-brand-800">
          <i data-lucide="arrow-left" class="w-4 h-4"></i><span id="label-all-tours"></span>
        </button>
        <div class="mt-3 flex flex-wrap items-end justify-between gap-x-6 gap-y-3">
          <div class="min-w-0">
            <h1 id="tour-title" class="font-display text-2xl md:text-3xl leading-tight"></h1>
            <p id="tour-stats" class="mt-1.5 text-sm text-stone-600 flex flex-wrap gap-x-4 gap-y-1"></p>
          </div>
          <button id="tour-share" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg border border-stone-300 text-sm font-semibold hover:bg-stone-100">
            <i data-lucide="share-2" class="w-4 h-4"></i><span class="share-label"></span>
          </button>
        </div>
        <div class="mt-4">
          <div class="h-2 rounded-full bg-stone-200 overflow-hidden"><div id="tour-progress-bar" class="h-full bg-leaf-500 rounded-full transition-all" style="width:0%"></div></div>
          <p id="progress-text" class="mt-1.5 text-xs font-semibold text-stone-600"></p>
        </div>
      </div>
    </div>

    <!-- Explore head (only in explore) -->
    <div id="explore-head" class="hidden bg-white">
      <div class="max-w-6xl mx-auto px-4 pt-5 pb-2 flex items-baseline justify-between gap-4">
        <h1 id="explore-title" class="font-display text-2xl md:text-3xl leading-tight"></h1>
        <span id="explore-count" class="text-sm text-stone-500 font-medium"></span>
      </div>
    </div>

    <!-- Sticky toolbar -->
    <div id="toolbar" class="sticky top-[60px] z-40 bg-white/95 backdrop-blur border-b border-stone-200">
      <div class="max-w-6xl mx-auto px-4 py-2.5 flex flex-wrap items-center gap-2 text-sm">
        <label id="search-wrap" class="hidden relative flex-1 min-w-[150px]">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-stone-400"></i>
          <span id="label-search" class="sr-only"></span>
          <input id="search-input" type="search" autocomplete="off" oninput="onSearch(this.value)"
                 class="w-full pl-9 pr-3 py-2 rounded-lg bg-stone-100 border border-stone-200 text-base sm:text-sm focus:outline-none focus:border-brand-400 focus:bg-white">
        </label>
        <div class="flex items-center gap-2 ml-auto">
          <button id="gps-btn" onclick="toggleGPS()" aria-label="GPS" class="px-3 py-2 rounded-lg border border-stone-300 bg-white font-semibold flex items-center gap-2 transition active:scale-95 hover:bg-stone-100">
            <i data-lucide="locate" class="w-4 h-4 shrink-0"></i><span id="label-gps" class="truncate hidden sm:inline"></span>
          </button>
          <button id="wc-toggle" onclick="toggleWC()" aria-pressed="true" class="px-3 py-2 rounded-lg border font-semibold flex items-center gap-2 transition active:scale-95">
            <span class="text-[11px] font-bold border-2 border-current rounded px-0.5 leading-none py-0.5">WC</span><span id="label-wc" class="truncate hidden sm:inline"></span>
          </button>
        </div>
        <div id="cat-chips" class="hidden chip-row w-full flex gap-2 overflow-x-auto pb-0.5 -mx-4 px-4"></div>
      </div>
    </div>

    <main class="max-w-6xl w-full mx-auto px-4 py-4 grid md:grid-cols-[minmax(0,1.05fr)_minmax(0,1fr)] gap-4 md:gap-6 items-start">
      <div id="map-card" class="bg-white rounded-2xl overflow-hidden border border-stone-200">
        <div id="map"></div>
        <div id="map-legend" class="px-3 py-2 text-[11px] text-stone-600 flex flex-wrap gap-x-4 gap-y-1 border-t border-stone-200"></div>
      </div>
      <div id="list-container" class="flex flex-col gap-3 min-w-0"></div>
    </main>
  </section>

  <!-- Phone navigation -->
  <nav id="bottom-nav" class="md:hidden fixed inset-x-0 bottom-0 z-[1600] bg-white border-t border-stone-200 grid grid-cols-2"
       style="padding-bottom: env(safe-area-inset-bottom, 0px);" aria-label="Main">
    <button data-nav="tours" onclick="go('tours')" class="nav-tab h-[60px] flex flex-col items-center justify-center gap-0.5 text-xs font-semibold">
      <i data-lucide="route" class="w-5 h-5"></i><span class="nav-label-tours">Roteiros</span>
    </button>
    <button data-nav="explore" onclick="go('explore')" class="nav-tab h-[60px] flex flex-col items-center justify-center gap-0.5 text-xs font-semibold">
      <i data-lucide="map" class="w-5 h-5"></i><span class="nav-label-explore">Explorar</span>
    </button>
  </nav>

  <!-- Lightbox for photos -->
  <div id="lightbox" class="fixed inset-0 z-[2000] bg-ink/95 text-white flex-col" role="dialog" aria-modal="true" aria-labelledby="lb-title">
    <div class="flex items-center justify-between p-3 text-sm">
      <span id="lb-counter" class="text-white/70 font-medium"></span>
      <button id="lb-close" onclick="closeLightbox()" class="p-2 rounded-lg hover:bg-white/10" aria-label="Fechar">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
    </div>
    <div class="relative flex-1 min-h-0 flex items-center justify-center px-2" id="lb-stage">
      <button id="lb-prev" onclick="stepLightbox(-1)" class="absolute left-2 z-10 p-2 rounded-full bg-black/40 hover:bg-black/60" aria-label="Anterior">
        <i data-lucide="chevron-left" class="w-7 h-7"></i>
      </button>
      <img id="lb-img" src="" alt="" class="max-h-full max-w-full object-contain rounded" />
      <button id="lb-next" onclick="stepLightbox(1)" class="absolute right-2 z-10 p-2 rounded-full bg-black/40 hover:bg-black/60" aria-label="Próximo">
        <i data-lucide="chevron-right" class="w-7 h-7"></i>
      </button>
    </div>
    <div class="p-4 max-w-2xl w-full mx-auto">
      <h2 id="lb-title" class="font-display text-lg"></h2>
      <p id="lb-text" class="text-sm text-white/75 mt-1 leading-relaxed max-h-32 overflow-y-auto"></p>
      <p id="lb-credit" class="text-[11px] text-white/50 mt-2"></p>
    </div>
  </div>

  <!-- "You are here" banner (GPS proximity) -->
  <div id="near-banner" class="fixed inset-x-0 z-[1500] px-3 pt-3 pb-3 hidden" role="status" aria-live="polite">
    <div class="max-w-xl mx-auto bg-blue-600 text-white rounded-xl shadow-lg p-3 flex flex-wrap items-center gap-2">
      <span id="near-text" class="text-sm font-semibold flex-1 min-w-[160px]"></span>
      <button id="near-show" onclick="nearAction('show')" class="px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25 text-xs font-semibold"></button>
      <button id="near-listen" onclick="nearAction('listen')" class="px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25 text-xs font-semibold"></button>
      <button id="near-visit" onclick="nearAction('visit')" class="px-3 py-1.5 rounded-lg bg-white text-blue-700 hover:bg-blue-50 text-xs font-semibold"></button>
      <button id="near-close" onclick="nearAction('close')" class="p-1.5 rounded-lg hover:bg-white/15" aria-label="Schließen">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <!-- Short confirmation message -->
  <div id="toast" class="fixed left-1/2 z-[2100] px-4 py-2 rounded-full bg-ink text-white text-sm font-semibold shadow-lg" style="bottom: calc(var(--bottom-nav-h) + 16px);" role="status" aria-live="polite"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

      if (item.img) return item.img;
      const h = (item.highlights || []).find(x => x.img);
      return h ? h.img : null;
    }
    const fold = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

    function distanceMeters(a, b) {
      const R = 6371000, rad = x => x * Math.PI / 180;
      const dLat = rad(b[0] - a[0]), dLng = rad(b[1] - a[1]);
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }
    function formatDistance(meters) {
      return meters < 1000 ? `${Math.max(50, Math.round(meters / 50) * 50)} m` : `${(meters / 1000).toFixed(1).replace('.', ',')} km`;
    }
    // Rough walking estimate: streets are ~30 % longer than the straight line, 80 m per minute
    function walkEstimate(a, b) {
      const meters = distanceMeters(a, b) * 1.3;
      return { label: formatDistance(meters), minutes: Math.max(1, Math.round(meters / 80)) };
    }
    function mapsUrl(coords) {
      return `https://www.google.com/maps/dir/?api=1&destination=${coords[0]},${coords[1]}&travelmode=walking`;
    }
    function routeProgress(route) {
      const done = route.stops.filter(s => visited.has(s.key)).length;
      const next = route.stops.find(s => !visited.has(s.key));
      return { done, total: route.stops.length, next };
    }

    // ---------- Pavement pattern: the "panot de flor" of Barcelona's sidewalks ----------
    // One square slab per tile: the joint lines, four rings and the centre ring on top.
    // Colours are solid (pre-mixed with the background) so crossing rings don't look darker.
    function florTile(bg, joint, ring) {
      const rings = [[31, 31], [69, 31], [31, 69], [69, 69]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="19"/>`).join('');
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">` +
        `<rect x="0.5" y="0.5" width="63" height="63" fill="none" stroke="${joint}"/>` +
        `<g transform="translate(13 13) scale(.38)"><g fill="none" stroke="${ring}" stroke-width="7">${rings}</g>` +
        `<circle cx="50" cy="50" r="17" fill="${bg}" stroke="${ring}" stroke-width="7"/></g></svg>`;
      return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
    }
    function paintTiles() {
      const root = document.documentElement.style;
      root.setProperty('--tile-dark', florTile('#13253F', '#21324B', '#4F4A3A'));
      root.setProperty('--tile-light', florTile('#E7ECEA', '#D5DCDB', '#BBCBDA'));
    }

    // ---------- Shared card parts ----------
    const NOTE_STYLES = {
      warn:   { icon: '⚠️', cls: 'bg-red-50 border-red-200 text-red-900' },
      ticket: { icon: '🎟️', cls: 'bg-brand-50 border-brand-200 text-brand-900' },
      info:   { icon: 'ℹ️', cls: 'bg-stone-50 border-stone-300 text-ink' }
    };
    function notesHtml(notes) {
      if (!notes || !notes.length) return '';
      return notes.map(n => {
        const st = NOTE_STYLES[n.type] || NOTE_STYLES.info;
        const link = n.url ? ` <a href="${n.url}" target="_blank" rel="noopener noreferrer" class="underline font-semibold whitespace-nowrap">${escapeHtml(n.linkLabel || n.url)} ↗</a>` : '';
        return `<div class="p-2.5 border rounded-lg flex items-start gap-1.5 ${st.cls}"><span class="shrink-0">${st.icon}</span><div>${escapeHtml(n.text)}${link}</div></div>`;
      }).join('');
    }

    function stopPhotoHtml(item, txt) {
      if (!item.img) return '';
      const name = escapeHtml(item[currentLang].name);
      return `
        <figure class="space-y-1">
          <button onclick="openLightbox('${item.key}', 'main')" class="hl-img-wrap block w-full aspect-[16/9] overflow-hidden rounded-lg" aria-label="${name}">
            <img src="${commonsImg(item.img, 600)}" alt="${name}" loading="lazy" decoding="async" class="w-full h-full object-cover"
                 onerror="this.closest('figure').style.display='none'">
          </button>
          <figcaption class="text-[10px] text-stone-400">${creditHtml(item, txt)}</figcaption>
        </figure>`;
    }

    function highlightsHtml(item, txt) {
      const list = item.highlights || [];
      if (!list.length) return '';
      const key = item.key;
      const isOpen = openDetails.has(key);
      const hasImages = list.some(h => h.img);
      const entries = list.map((h, idx) => {
        const t = h[currentLang];
        const imgBlock = h.img ? `
          <button onclick="openLightbox('${key}', ${idx})" class="hl-img-wrap block w-full aspect-[16/10] overflow-hidden rounded-lg" aria-label="${escapeHtml(t.title)}">
            <img src="${commonsImg(h.img, 600)}" alt="${escapeHtml(t.title)}" loading="lazy" decoding="async" class="w-full h-full object-cover"
                 onerror="this.parentElement.style.display='none'">
          </button>` : '';
        return `
          <figure class="space-y-2">
            ${imgBlock}
            <figcaption>
              <h4 class="font-display text-[15px] text-ink">${escapeHtml(t.title)}</h4>
              <p class="text-[13px] text-stone-600 leading-relaxed mt-1">${escapeHtml(t.text)}</p>
              ${h.img ? `<p class="text-[10px] text-stone-400 mt-1">${creditHtml(h, txt)}</p>` : ''}
            </figcaption>
          </figure>`;
      }).join('');
      return `
        <button id="details-btn-${key}" onclick="toggleDetails('${key}')" aria-expanded="${isOpen}"
          class="${isOpen ? 'open-btn ' : ''}mt-1 w-full flex items-center justify-between gap-2 px-3 py-2 rounded-lg bg-saffron-50 border border-saffron-200 text-saffron-800 text-[13px] font-semibold hover:bg-saffron-100 transition">
          <span class="flex items-center gap-2"><i data-lucide="sparkles" class="w-4 h-4"></i><span class="details-label">${isOpen ? txt.lessLabel : txt.moreLabel}</span> (${list.length})</span>
          <i data-lucide="chevron-down" class="chevron w-4 h-4"></i>
        </button>
        <div id="details-panel-${key}" class="details-panel ${isOpen ? 'open' : ''} mt-3 space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <button onclick="speakItem('${key}', true)" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-brand-600 text-white text-xs font-semibold hover:bg-brand-700 transition">
              <i data-lucide="headphones" class="w-4 h-4"></i> ${txt.listenDetailed}
            </button>
            ${hasImages ? `<span class="text-[11px] text-stone-400">${txt.tapToEnlarge}</span>` : ''}
          </div>
          ${entries}
          <button onclick="toggleDetails('${key}', true)" class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-lg border border-saffron-200 text-saffron-800 text-xs font-semibold hover:bg-saffron-50 transition">
            <i data-lucide="chevron-up" class="w-4 h-4"></i> ${txt.lessLabel}
          </button>
        </div>`;
    }

    // Photo, text, tips, notes, wiki link and highlights – the same in tours and on the explore map
    function bodyHtml(item, txt) {
      const data = item[currentLang];
      return `
        ${stopPhotoHtml(item, txt)}
        <p class="leading-relaxed">${escapeHtml(data.longDesc)}</p>
        ${data.gastro ? `
          <div class="p-2.5 bg-saffron-50 border border-saffron-200 rounded-lg text-saffron-800 flex items-start gap-1.5">
            <span class="shrink-0">💡</span><div>${escapeHtml(data.gastro)}</div>
          </div>` : ''}
        ${notesHtml(data.notes)}
        ${item.wiki ? `
          <a href="${item.wiki}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-brand-600 hover:underline font-semibold">
            ${txt.readMoreWiki} <i data-lucide="external-link" class="w-3 h-3"></i>
          </a>` : ''}
        ${highlightsHtml(item, txt)}`;
    }

    // Way to the next stop inside a tour
    function navHtml(stop, txt) {
      const stops = currentRoute.stops;
      const i = stops.findIndex(s => s.key === stop.key);
      const next = stops[i + 1];
      if (!next) {
        return `<div class="px-3 py-2 rounded-lg bg-leaf-50 border border-leaf-100 text-leaf-600 text-xs font-semibold text-center">${txt.endOfTour}</div>`;
      }
      const nextName = escapeHtml(next[currentLang].name);
      const mode = legMode(stop);
      if (mode !== 'walk') {
        const look = {
          cablecar: { icon: 'cable-car', cls: 'bg-red-50 border-red-200 text-red-900', sub: 'text-red-700', label: txt.cableLeg },
          bus:      { icon: 'bus', cls: 'bg-saffron-50 border-saffron-200 text-saffron-800', sub: 'text-saffron-600', label: txt.busLeg },
          boat:     { icon: 'ship', cls: 'bg-cyan-50 border-cyan-200 text-cyan-900', sub: 'text-cyan-700', label: txt.boatLeg }
        }[mode];
        const hint = stop[currentLang].nextHint || look.label;
        return `
          <div class="flex items-center justify-between gap-2 px-3 py-2 rounded-lg border text-xs font-semibold ${look.cls}">
            <span class="flex items-center gap-2 min-w-0"><i data-lucide="${look.icon}" class="w-4 h-4 shrink-0"></i><span class="truncate">${next.id}. ${nextName}</span></span>
            <span class="shrink-0 ${look.sub}">${escapeHtml(hint)}</span>
          </div>`;
      }
      const w = walkEstimate(stop.coords, next.coords);
      return `
        <a href="${mapsUrl(next.coords)}" target="_blank" rel="noopener noreferrer"
           class="flex items-center justify-between gap-2 px-3 py-2 rounded-lg bg-brand-50 border border-brand-100 text-brand-800 text-xs font-semibold hover:bg-brand-100 transition">
          <span class="flex items-center gap-2 min-w-0"><i data-lucide="footprints" class="w-4 h-4 shrink-0"></i><span class="truncate">${txt.nextStop} ${next.id}: ${nextName}</span></span>
          <span class="shrink-0 text-brand-500 flex items-center gap-1">${w.label} · ≈ ${w.minutes} ${txt.walkMin} <i data-lucide="external-link" class="w-3 h-3"></i></span>
        </a>`;
    }

    function categoryLabels(item, txt) {
      return (item.cats || []).map(c =>
        `<span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full" style="background:${CATEGORY_COLORS[c]}"></span>${txt.cats[c]}</span>`
      ).join('');
    }

    // ---------- Cards ----------
    function tourCardEl(stop, txt) {
      const done = visited.has(stop.key);
      const data = stop[currentLang];
      const el = document.createElement('article');
      el.id = `card-${stop.key}`;
      el.className = `p-4 bg-white rounded-xl border ${done ? 'border-leaf-100 bg-leaf-50/40' : 'border-stone-200'} ${stop.key === nearKey ? 'is-near' : ''}`;
      el.dataset.nearLabel = `📍 ${txt.hereNow}`;
      el.innerHTML = `
        <div class="flex items-start justify-between gap-2 cursor-pointer" onclick="focusItem('${stop.key}')">
          <div class="flex items-start gap-3 min-w-0">
            <button onclick="event.stopPropagation(); toggleVisited('${stop.key}')" title="${txt.markVisited}" aria-label="${txt.markVisited}" aria-pressed="${done}"
              class="mt-0.5 w-8 h-8 rounded-full border-2 flex items-center justify-center text-sm font-bold shrink-0 transition ${done ? 'bg-leaf-500 border-leaf-500 text-white' : 'border-ink text-ink hover:bg-ink hover:text-white'}">
              ${done ? '✓' : stop.id}
            </button>
            <div class="min-w-0">
              <h3 class="font-display text-lg leading-snug ${done ? 'text-stone-500' : 'text-ink'}">${escapeHtml(data.name)}</h3>
              <p class="text-[13px] text-stone-600 mt-0.5">${escapeHtml(data.shortDesc)}</p>
            </div>
          </div>
          <button onclick="event.stopPropagation(); speakItem('${stop.key}', false)" class="p-2 text-stone-500 hover:text-brand-600 hover:bg-brand-50 rounded-lg shrink-0 transition" title="${txt.audioTooltip}" aria-label="${txt.audioTooltip}">
            <i data-lucide="volume-2" class="w-5 h-5"></i>
          </button>
        </div>
        <div class="mt-3 pt-3 border-t border-stone-100 text-[13px] text-stone-700 space-y-3">
          ${bodyHtml(stop, txt)}
          ${navHtml(stop, txt)}
        </div>`;
      return el;
    }

    function exploreCardEl(item, txt) {
      const done = visited.has(item.key);
      const open = expanded.has(item.key);
      const data = item[currentLang];
      const img = firstImage(item);
      const dist = userCoords ? formatDistance(distanceMeters(userCoords, item.coords)) : '';
      const thumb = img
        ? `<img src="${commonsImg(img, 160)}" alt="" loading="lazy" class="w-full h-full object-cover" onerror="this.remove()">`
        : '';
      const tours = item.tours.map(t => {
        const r = routes.find(x => x.id === t.routeId);
        return `<a href="#tour/${t.routeId}/${t.n}" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-stone-100 hover:bg-stone-200 text-xs font-semibold text-ink">
          <i data-lucide="route" class="w-3.5 h-3.5"></i>${escapeHtml(r[currentLang].title)} <span class="text-stone-500 font-medium">${txt.stationShort(t.n)}</span></a>`;
      }).join('');
      const el = document.createElement('article');
      el.id = `card-${item.key}`;
      el.className = `bg-white rounded-xl border ${open ? 'border-stone-300' : 'border-stone-200'} ${item.key === nearKey ? 'is-near' : ''}`;
      el.dataset.nearLabel = `📍 ${txt.hereNow}`;
      el.innerHTML = `
        <button onclick="toggleExpand('${item.key}')" aria-expanded="${open}" class="${open ? 'open-btn ' : ''}w-full text-left flex items-center gap-3 p-3">
          <span class="w-16 h-16 rounded-lg overflow-hidden shrink-0 tile-bg relative">${thumb}
            ${done ? '<span class="absolute inset-0 bg-leaf-500/80 text-white flex items-center justify-center text-xl font-bold">✓</span>' : ''}
          </span>
          <span class="min-w-0 flex-1">
            <span class="font-display text-[17px] leading-snug block text-ink">${escapeHtml(data.name)}</span>
            <span class="text-[13px] text-stone-600 block mt-0.5 ${open ? '' : 'line-clamp-1'}">${escapeHtml(data.shortDesc)}</span>
            <span class="mt-1.5 flex flex-wrap gap-x-3 gap-y-1 text-[11px] font-semibold text-stone-600">${categoryLabels(item, txt)}${dist ? `<span class="text-brand-600">${txt.away(dist)}</span>` : ''}</span>
          </span>
          <i data-lucide="chevron-down" class="chevron w-5 h-5 text-stone-400 shrink-0"></i>
        </button>
        ${open ? `
        <div class="px-4 pb-4 pt-3 border-t border-stone-100 text-[13px] text-stone-700 space-y-3">
          <div class="flex flex-wrap gap-2">
            <button onclick="toggleVisited('${item.key}')" aria-pressed="${done}" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border text-xs font-semibold ${done ? 'bg-leaf-500 border-leaf-500 text-white' : 'border-stone-300 hover:bg-stone-100'}">
              <i data-lucide="${done ? 'check-circle-2' : 'circle'}" class="w-4 h-4"></i>${done ? txt.visited : txt.markVisited}
            </button>
            <button onclick="speakItem('${item.key}', false)" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-stone-300 hover:bg-stone-100 text-xs font-semibold">
              <i data-lucide="volume-2" class="w-4 h-4"></i>${txt.listen}
            </button>
            <button onclick="focusItem('${item.key}')" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-stone-300 hover:bg-stone-100 text-xs font-semibold">
              <i data-lucide="map-pin" class="w-4 h-4"></i>${txt.show}
            </button>
            <a href="${mapsUrl(item.coords)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-stone-300 hover:bg-stone-100 text-xs font-semibold">
              <i data-lucide="footprints" class="w-4 h-4"></i>${txt.directions} <i data-lucide="external-link" class="w-3 h-3"></i>
            </a>
          </div>
          ${bodyHtml(item, txt)}
          <div class="pt-1">
            <h4 class="text-xs font-semibold text-stone-500 mb-2">${txt.inTours}</h4>
            <div class="flex flex-wrap gap-2">${tours}</div>
          </div>
        </div>` : ''}`;
      return el;
    }

    // ---------- Explore filter ----------
    function filteredItems() {
      const q = fold(searchTerm.trim());
      let list = catalog.filter(item =>
        (!activeCats.size || item.cats.some(c => activeCats.has(c))) &&
        (!q || fold(item[currentLang].name + ' ' + item[currentLang].shortDesc + ' ' + item.pt.name + ' ' + item.de.name).includes(q))
      );
      if (userCoords) {
        list = list.slice().sort((a, b) => distanceMeters(userCoords, a.coords) - distanceMeters(userCoords, b.coords));
      } else {
        list = list.slice().sort((a, b) => a[currentLang].name.localeCompare(b[currentLang].name, currentLang));
      }
      return list;
    }

    function renderCategoryChips() {
      const txt = T();
      const chip = (id, label, color, active) => `
        <button onclick="toggleCategory('${id}')" aria-pressed="${active}"
          class="shrink-0 inline-flex items-center gap-2 px-3 py-1.5 rounded-full border text-[13px] font-semibold transition ${active ? 'bg-ink border-ink text-white' : 'bg-white border-stone-300 text-ink hover:bg-stone-100'}">
          ${color ? `<span class="w-2.5 h-2.5 rounded-full" style="background:${color}"></span>` : ''}${label}
        </button>`;
      document.getElementById('cat-chips').innerHTML =
        chip('all', txt.allCats, null, activeCats.size === 0) +
        CATEGORY_ORDER.map(c => chip(c, txt.cats[c], CATEGORY_COLORS[c], activeCats.has(c))).join('');
    }

    window.toggleCategory = function(id) {
      if (id === 'all') activeCats.clear();
      else if (activeCats.has(id)) activeCats.delete(id);
      else activeCats.add(id);
      renderCategoryChips();
      refreshExplore(true);
    };
    window.onSearch = function(value) {
      searchTerm = value;
      refreshExplore(false);
    };
    function refreshExplore(refit) {
      items = filteredItems();
      drawMap();
      renderList();
      if (refit && items.length) fitItems();
    }

    // ---------- Map drawing ----------
    function markerIcon(item) {
      const done = visited.has(item.key);
      if (view === 'tour') {
        const hasDetails = !!(item.highlights && item.highlights.length);
        return L.divIcon({
          className: '', iconSize: [28, 28], iconAnchor: [14, 14],
          html: `<div class="stop-pin ${done ? 'completed' : ''} ${hasDetails ? 'has-details' : ''}" style="width:28px;height:28px">${done ? '✓' : item.id}</div>`
        });
      }
      const color = done ? 'var(--leaf)' : CATEGORY_COLORS[item.cats[0]];
      const sel = expanded.has(item.key);
      const size = sel ? 26 : 20;
      return L.divIcon({
        className: '', iconSize: [size, size], iconAnchor: [size / 2, size / 2],
        html: `<div class="place-pin ${sel ? 'selected' : ''}" style="width:${size}px;height:${size}px;background:${color}">${done ? '✓' : ''}</div>`
      });
    }

    function popupHtml(item) {
      const data = item[currentLang];
      const img = firstImage(item);
      const pic = img ? `<img src="${commonsImg(img, 330)}" alt="" style="width:200px;height:120px;object-fit:cover;border-radius:6px;margin-top:6px" loading="lazy" onerror="this.remove()">` : '';
      const label = view === 'tour' ? `${item.id}. ${escapeHtml(data.name)}` : escapeHtml(data.name);
      return `<b>${label}</b><br>${escapeHtml(data.shortDesc)}${pic}`;
    }

    function drawMap() {
      routeLayer.clearLayers();
      markerLayer.clearLayers();
      Object.keys(markers).forEach(k => delete markers[k]);
      if (view === 'tour') {
        const stops = currentRoute.stops;
        for (let i = 0; i < stops.length - 1; i++) {
          L.polyline([stops[i].coords, stops[i + 1].coords], LEG_STYLES[legMode(stops[i])]).addTo(routeLayer);
        }
      }
      items.forEach(item => {
        const m = L.marker(item.coords, { icon: markerIcon(item), zIndexOffset: expanded.has(item.key) ? 500 : 0 }).addTo(markerLayer);
        m.bindPopup(popupHtml(item));
        m.on('click', () => onMarkerClick(item.key));
        markers[item.key] = m;
      });
      renderToilets();
      renderLegend();
    }
    function refreshMarkers() {
      items.forEach(item => { if (markers[item.key]) markers[item.key].setIcon(markerIcon(item)); });
    }
    function fitItems() {
      const list = view === 'tour' ? currentRoute.stops : items;
      if (list.length) map.fitBounds(L.latLngBounds(list.map(s => s.coords)), { padding: [25, 25], maxZoom: 16 });
    }

    function renderToilets() {
      wcMarkersGroup.clearLayers();
      const txt = T();
      if (!showWC || view === 'tours') return;
      currentToilets().forEach(wc => {
        const icon = L.divIcon({ className: '', html: '<div class="wc-pin" style="width:24px;height:20px">WC</div>', iconSize: [24, 20], iconAnchor: [12, 10] });
        L.marker(wc.coords, { icon }).bindPopup(`<b>${txt.wcPopupTitle}</b><br>${escapeHtml(wc.name)}`).addTo(wcMarkersGroup);
      });
    }
    function currentToilets() { return view === 'tour' ? currentRoute.toilets : allToilets; }

    function renderLegend() {
      const el = document.getElementById('map-legend');
      if (view !== 'tour') { el.innerHTML = ''; el.classList.add('hidden'); return; }
      const txt = T();
      const modes = [...new Set(currentRoute.stops.slice(0, -1).map(legMode))];
      const label = { walk: txt.legendWalk, bus: txt.legendBus, cablecar: txt.legendCable, boat: txt.legendBoat };
      el.innerHTML = ['walk', 'bus', 'cablecar', 'boat'].filter(m => modes.includes(m)).map(m => {
        const st = LEG_STYLES[m];
        return `<span class="inline-flex items-center gap-1.5"><svg width="26" height="6" aria-hidden="true"><line x1="2" y1="3" x2="24" y2="3" stroke="${st.color}" stroke-width="3" stroke-dasharray="${st.dashArray}" stroke-linecap="round"/></svg>${label[m]}</span>`;
      }).join('');
      el.classList.toggle('hidden', modes.length < 2);
    }

    // ---------- Rendering ----------
    function stickyOffset() {
      const bar = document.getElementById('toolbar');
      if (view !== 'tours' && bar) return bar.getBoundingClientRect().bottom + 12;
      return document.getElementById('app-header').getBoundingClientRect().bottom + 12;
    }
    function updateStickyTop() {
      const header = document.getElementById('app-header').offsetHeight;
      const bar = document.getElementById('toolbar').offsetHeight;
      document.documentElement.style.setProperty('--map-top', `${header + bar + 16}px`);
    }

    // Remember which card is at the top of the screen, so a full re-render doesn't make the list jump
    function captureListAnchor() {
      const limit = stickyOffset();
      for (const card of document.querySelectorAll('#list-container > article')) {
        const r = card.getBoundingClientRect();
        if (r.bottom > limit) return { id: card.id, top: r.top };
      }
      return null;
    }
    function restoreListAnchor(anchor) {
      if (!anchor) return;
      const card = document.getElementById(anchor.id);
      if (!card) return;
      const diff = card.getBoundingClientRect().top - anchor.top;

    function replaceCard(key) {

    // Small, fixed OpenStreetMap maps on the tour cards.
    // Tailwind styles new elements a moment after they are inserted, so a card's map box can
    // still be 0 px high when the map is created. Fitting the route then zooms in all the way –
    // so the route is fitted again whenever the box gets (or changes) its real size.
    const miniMaps = [];
    function removeMiniMaps() {
      miniMaps.splice(0).forEach(m => { if (m._sizeWatch) m._sizeWatch.disconnect(); m.remove(); });
    }
    function watchSize(el, onResize) {
      if (typeof ResizeObserver === 'undefined') { setTimeout(onResize, 300); return null; }
      const ro = new ResizeObserver(onResize);
      ro.observe(el);
      return ro;
    }
    function renderMiniMaps() {
      removeMiniMaps();
      routes.forEach(route => {
        const el = document.getElementById(`mini-map-${route.id}`);
        if (!el) return;
        const m = L.map(el, {
          zoomControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
          boxZoom: false, keyboard: false, touchZoom: false, tap: false
        });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(m);
        const stops = route.stops;
        for (let i = 0; i < stops.length - 1; i++) {
          L.polyline([stops[i].coords, stops[i + 1].coords], { ...LEG_STYLES[legMode(stops[i])], interactive: false }).addTo(m);
        }
        stops.forEach(s => L.circleMarker(s.coords, { radius: 3.5, color: '#13253F', weight: 1.5, fillColor: '#fff', fillOpacity: 1, interactive: false }).addTo(m));
        L.circleMarker(stops[0].coords, { radius: 8, color: '#fff', weight: 2, fillColor: '#13253F', fillOpacity: 1, interactive: false }).addTo(m);
        L.circleMarker(stops[stops.length - 1].coords, { radius: 8.5, color: '#13253F', weight: 2.2, fillColor: '#EDA526', fillOpacity: 1, interactive: false }).addTo(m);
        const bounds = L.latLngBounds(stops.map(s => s.coords));
        const fit = () => {
          if (!el.clientWidth || !el.clientHeight) return;
          m.invalidateSize();
          m.fitBounds(bounds, { padding: [24, 24] });
        };
        m.setView(bounds.getCenter(), 13);   // a valid start view, replaced by fit() once the size is known
        fit();
        m._sizeWatch = watchSize(el, fit);
        miniMaps.push(m);
      });
    }

              <dt class="text-stone-500 flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-ink"></span>${txt.startLabel}</dt><dd class="font-semibold truncate">${escapeHtml(first)}</dd>
              <dt class="text-stone-500 flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-saffron-400 ring-2 ring-ink"></span>${txt.finishLabel}</dt><dd class="font-semibold truncate">${escapeHtml(last)}</dd>

            <div class="mt-4 flex flex-wrap gap-x-5 gap-y-2 text-sm font-semibold text-ink">

              <span class="inline-flex items-center gap-1.5"><i data-lucide="clock" class="w-4 h-4 text-brand-600"></i>${route.duration}</span>

            ${p.done ? `
            <div class="mt-6 max-w-lg">

            <div class="mt-6 flex flex-wrap gap-2">
              <a href="${action.hash}" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-semibold">

    function updateTourHead() {

    function updateWcButton() {

    // ---------- Views ----------
    function setView(v) {

      document.getElementById('explore-head').classList.toggle('hidden', v !== 'explore');
      document.getElementById('search-wrap').classList.toggle('hidden', v !== 'explore');

      dismissedNearKey = null;
      updateNearBanner();
    }

    function showTours() {
      setView('tours');
      updateChrome();
      renderTourList();
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function showExplore(key) {
      setView('explore');
      currentRoute = null;
      if (key && catalogByKey[key]) { expanded.add(key); activeCats.clear(); searchTerm = ''; document.getElementById('search-input').value = ''; }
      items = filteredItems();
      updateChrome();
      renderCategoryChips();
      updateStickyTop();
      map.invalidateSize();
      drawMap();
      document.getElementById('list-container').innerHTML = '';
      renderList();
      if (key && catalogByKey[key]) {
        map.setView(catalogByKey[key].coords, 16);
        scrollToCard(key);
      } else {
        fitItems();
        window.scrollTo({ top: 0, behavior: 'auto' });
      }
      if (userCoords) checkProximity(userCoords, 0);
    }

    function showTour(id, n) {
      const route = routes.find(r => r.id === id);
      setView('tour');
      if (currentRoute !== route) openDetails.clear();
      currentRoute = route;
      items = route.stops;
      updateChrome();
      updateTourHead();
      updateStickyTop();
      map.invalidateSize();
      drawMap();
      fitItems();
      document.getElementById('list-container').innerHTML = '';
      renderList();
      const target = n ? route.stops.find(s => s.id === n) : null;
      if (target) scrollToCard(target.key);
      else window.scrollTo({ top: 0, behavior: 'auto' });
      if (userCoords) checkProximity(userCoords, 0);
    }

    function parseHash() {
      const parts = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/');
      if (parts[0] === 'explore') return { view: 'explore', key: parts[1] || null };
      if (parts[0] === 'tour' && routes.some(r => r.id === parts[1])) return { view: 'tour', id: parts[1], n: parts[2] ? Number(parts[2]) : null };
      return { view: 'tours' };
    }
    function applyHash() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      if (lightboxState) closeLightbox();
      const st = parseHash();
      if (st.view === 'explore') showExplore(st.key);
      else if (st.view === 'tour') showTour(st.id, st.n);
      else showTours();
    }
    window.go = function(v, arg) {
      const hash = arg ? `#${v}/${arg}` : `#${v}`;
      if (location.hash === hash) applyHash(); else location.hash = hash;
    };
    window.addEventListener('hashchange', applyHash);

    function rerender() {
      updateChrome();
      if (view === 'tours') { renderTourList(); return; }
      if (view === 'tour') updateTourHead();
      else { renderCategoryChips(); items = filteredItems(); }
      drawMap();
      renderList();
      updateNearBanner();
      updateStickyTop();
    }

    window.setLanguage = function(lang) {
      if (currentLang === lang) return;
      currentLang = lang;
      saveStored('bcn_tour_lang_v2', lang);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      rerender();
      if (lightboxState) renderLightbox();
    };

    window.shareTour = function(id) {
      const route = routes.find(r => r.id === id);
      const url = `${location.href.split('#')[0]}#tour/${id}`;
      const title = route[currentLang].title;
      if (navigator.share) {
        navigator.share({ title, url }).catch(() => {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => toast(T().linkCopied), () => window.prompt(T().shareLink, url));
      } else {
        window.prompt(T().shareLink, url);
      }
    };
    let toastTimer = null;
    function toast(msg) {
      const el = document.getElementById('toast');
      el.innerText = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);

    }

    // ---------- Interactions ----------
    const prefersReducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function scrollToElement(el) {
      const top = el.getBoundingClientRect().top + window.scrollY - stickyOffset();
      window.scrollTo({ top: Math.max(0, top), behavior: prefersReducedMotion() ? 'auto' : 'smooth' });

    function scrollToCard(key) {

      card.classList.remove('card-flash');

    function onMarkerClick(key) {
      if (view === 'explore' && !expanded.has(key)) {
        expanded.add(key);

        refreshMarkers();

    window.toggleExpand = function(key) {

      replaceCard(key);
      if (markers[key]) markers[key].setIcon(markerIcon(getItem(key)));
    };

    window.toggleVisited = function(key) {
      if (visited.has(key)) visited.delete(key); else visited.add(key);
      saveStored(VISITED_KEY, [...visited]);
      replaceCard(key);
      refreshMarkers();
      if (view === 'tour') updateTourHead();
      updateNearBanner();
    };

    // Open/close the details of one place without rebuilding the list.
    // fromBottom = the "close" button at the end of a long panel was used.
    window.toggleDetails = function(key, fromBottom) {
      const btn = document.getElementById(`details-btn-${key}`);
      const panel = document.getElementById(`details-panel-${key}`);
      if (!btn || !panel) return;
      const txt = T();
      const opening = !openDetails.has(key);
      const before = btn.getBoundingClientRect().top;
      if (opening) openDetails.add(key); else openDetails.delete(key);
      panel.classList.toggle('open', opening);
      btn.classList.toggle('open-btn', opening);
      btn.setAttribute('aria-expanded', String(opening));
      btn.querySelector('.details-label').textContent = opening ? txt.lessLabel : txt.moreLabel;
      if (fromBottom) {
        const card = document.getElementById(`card-${key}`);
        if (card && card.getBoundingClientRect().top < stickyOffset()) scrollToElement(card);

      }

    window.toggleWC = function() {
      showWC = !showWC;
      renderToilets();
      updateWcButton();
    };

    // ---------- Text-to-Speech ----------
    // detailed=true also reads all highlight texts.
    window.speakItem = function(key, detailed) {
      const txt = T();
      if (!('speechSynthesis' in window)) { alert(txt.ttsUnsupported); return; }
      if (window.speechSynthesis.speaking) { window.speechSynthesis.cancel(); return; }
      const item = getItem(key);
      const data = item[currentLang];
      let text = `${data.name}. ${data.longDesc}`;
      if (detailed && item.highlights) {
        text += ' ' + item.highlights.map(h => `${h[currentLang].title}. ${h[currentLang].text}`).join(' ');
      }
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = currentLang === 'pt' ? 'pt-BR' : 'de-DE';
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
    };

    // ---------- Lightbox ----------
    // All photos of a place: its own photo ('main') first, then highlight photos (by index)
    function lightboxList(key) {
      const item = getItem(key);
      const list = [];
      if (item.img) list.push({ key: 'main', src: item, title: item[currentLang].name, text: item[currentLang].shortDesc });
      (item.highlights || []).forEach((h, idx) => {
        if (h.img) list.push({ key: idx, src: h, title: h[currentLang].title, text: h[currentLang].text });
      });
      return list;
    }
    function renderLightbox() {
      const { key, index } = lightboxState;
      const txt = T();
      const list = lightboxList(key);
      const pos = Math.max(0, list.findIndex(entry => entry.key === index));
      const entry = list[pos];
      const img = document.getElementById('lb-img');
      img.src = commonsImg(entry.src.img, 1280);
      img.alt = entry.title;
      document.getElementById('lb-title').innerText = entry.title;
      document.getElementById('lb-text').innerText = entry.text;
      document.getElementById('lb-credit').innerHTML = creditHtml(entry.src, txt);
      document.getElementById('lb-counter').innerText = `${pos + 1} / ${list.length}`;
      document.getElementById('lb-prev').style.visibility = list.length > 1 ? 'visible' : 'hidden';
      document.getElementById('lb-next').style.visibility = list.length > 1 ? 'visible' : 'hidden';
    }
    window.openLightbox = function(key, index) {
      lightboxState = { key, index };
      renderLightbox();
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
      document.getElementById('lb-close').focus();
    };
    window.closeLightbox = function() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
      document.getElementById('lb-img').src = '';
      lightboxState = null;
    };
    window.stepLightbox = function(dir) {
      if (!lightboxState) return;
      const list = lightboxList(lightboxState.key);
      const pos = list.findIndex(entry => entry.key === lightboxState.index);
      lightboxState.index = list[(pos + dir + list.length) % list.length].key;
      renderLightbox();
    };
    document.addEventListener('keydown', (e) => {
      if (!lightboxState) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') stepLightbox(-1);
      if (e.key === 'ArrowRight') stepLightbox(1);

    // Swipe left/right on phones; tap on the dark background closes
    (function initSwipe() {
      const stage = document.getElementById('lb-stage');
      let startX = null;
      stage.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
      stage.addEventListener('touchend', e => {
        if (startX === null) return;
        const dx = e.changedTouches[0].clientX - startX;
        if (Math.abs(dx) > 50) stepLightbox(dx < 0 ? 1 : -1);
        startX = null;
      });
      stage.addEventListener('click', e => { if (e.target === stage) closeLightbox(); });
    })();

    // ---------- Live GPS ----------
    window.toggleGPS = function() {
      const btn = document.getElementById('gps-btn');
      const label = document.getElementById('label-gps');
      const txt = T();
      const activeCls = ['bg-brand-600', 'border-brand-600', 'text-white', 'hover:bg-brand-700'];
      const idleCls = ['bg-white', 'border-stone-300', 'hover:bg-stone-100'];

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        if (userMarker) map.removeLayer(userMarker);
        userMarker = null;
        userCoords = null;
        lastSortCoords = null;
        btn.classList.remove(...activeCls);
        btn.classList.add(...idleCls);
        label.innerText = txt.gpsLabel;
        setNearKey(null);
        if (view === 'explore') { items = filteredItems(); renderList(); }
        return;
      }
      if (!('geolocation' in navigator)) { alert(txt.noGps); return; }
      btn.classList.add(...activeCls);
      btn.classList.remove(...idleCls);
      label.innerText = txt.gpsSearching;
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          userCoords = [pos.coords.latitude, pos.coords.longitude];
          if (!userMarker) {
            const userIcon = L.divIcon({ className: 'user-location-marker', iconSize: [16, 16], iconAnchor: [8, 8] });
            userMarker = L.marker(userCoords, { icon: userIcon, zIndexOffset: 1000 }).addTo(map).bindPopup(`<b>${T().userLocation}</b>`);
            map.setView(userCoords, 16);
          } else {
            userMarker.setLatLng(userCoords);
          }
          label.innerText = T().gpsActive;
          // Explore list is sorted by distance; re-sort only after moving a bit
          if (view === 'explore' && (!lastSortCoords || distanceMeters(lastSortCoords, userCoords) > 40)) {
            lastSortCoords = userCoords;
            items = filteredItems();
            renderList();
          }
          checkProximity(userCoords, pos.coords.accuracy);
        },
        () => {
          alert(T().gpsError);
          toggleGPS();
        },
        { enableHighAccuracy: true }
      );
    };

    // ---------- "You are here": detect when the GPS position reaches a place ----------
    const NEAR_ENTER_M = 60;   // closer than this -> you are at the place
    const NEAR_LEAVE_M = 110;  // farther than this -> you left it (gap avoids flickering)
    function proximityPool() { return view === 'tour' ? currentRoute.stops : view === 'explore' ? catalog : []; }

    function checkProximity(coords, accuracy) {
      const pool = proximityPool();
      const current = nearKey && pool.find(s => s.key === nearKey);
      if (nearKey !== null && (!current || distanceMeters(coords, current.coords) > NEAR_LEAVE_M)) setNearKey(null);
      let best = null, bestD = Infinity;
      pool.forEach(s => {
        const d = distanceMeters(coords, s.coords);
        if (d < bestD) { bestD = d; best = s; }
      });
      const tolerance = Math.min(accuracy || 0, 40);
      if (best && bestD <= NEAR_ENTER_M + tolerance && best.key !== nearKey) setNearKey(best.key);
    }

    function setNearKey(key) {
      if (key === nearKey) return;
      document.querySelectorAll('.is-near').forEach(el => el.classList.remove('is-near'));
      nearKey = key;
      if (key !== null) {
        const card = document.getElementById(`card-${key}`);
        if (card) card.classList.add('is-near');
        if (navigator.vibrate) { try { navigator.vibrate(120); } catch (e) {} }
      }
      updateNearBanner();
    }

    function updateNearBanner() {
      const banner = document.getElementById('near-banner');
      if (nearKey === null || nearKey === dismissedNearKey || view === 'tours') { banner.classList.add('hidden'); return; }
      const txt = T();
      const item = view === 'tour' ? currentRoute.stops.find(s => s.key === nearKey) : catalogByKey[nearKey];
      if (!item) { banner.classList.add('hidden'); return; }
      const label = view === 'tour' ? `${item.id}. ${item[currentLang].name}` : item[currentLang].name;
      document.getElementById('near-text').innerText = `📍 ${txt.hereNow}: ${label}`;
      document.getElementById('near-show').innerText = txt.show;
      document.getElementById('near-listen').innerText = `🔊 ${txt.listen}`;
      const visitBtn = document.getElementById('near-visit');
      visitBtn.innerText = txt.markVisitedShort;
      visitBtn.style.display = visited.has(nearKey) ? 'none' : '';
      document.getElementById('near-close').setAttribute('aria-label', txt.close);
      banner.classList.remove('hidden');
    }

    window.nearAction = function(action) {
      if (nearKey === null) return;
      if (action === 'show') {
        if (view === 'explore') {
          // the place might be filtered out – show everything again
          if (!items.some(i => i.key === nearKey)) { activeCats.clear(); searchTerm = ''; document.getElementById('search-input').value = ''; renderCategoryChips(); refreshExplore(false); }
          if (!expanded.has(nearKey)) { expanded.add(nearKey); replaceCard(nearKey); refreshMarkers(); }
        }
        scrollToCard(nearKey);
      }
      if (action === 'listen') speakItem(nearKey, false);
      if (action === 'visit' && !visited.has(nearKey)) toggleVisited(nearKey);
      if (action === 'close') { dismissedNearKey = nearKey; updateNearBanner(); }
    };

    window.addEventListener('resize', () => { if (view !== 'tours') updateStickyTop(); });

    // ---------- Init ----------
    paintTiles();
    applyHash();
  </script>
</body>
</html>
